<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trending | Carl Louis</title>
    <style>
        :root {
            --bg-color: #0D1117; /* GitHub 暗黑模式背景 */
            --card-bg: #161B22;
            --text-main: #C9D1D9;
            --text-sub: #8B949E;
            --accent-blue: #58A6FF;
            --border: #30363D;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --radius: 12px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .title h1 { font-size: 2rem; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .title p { color: var(--text-sub); margin-top: 5px; font-size: 0.9rem; }

        .back-btn {
            text-decoration: none; color: var(--accent-blue);
            font-weight: 600; font-size: 0.9rem;
            border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px;
            transition: 0.2s;
        }
        .back-btn:hover { background: var(--border); }

        /* --- 列表样式 --- */
        .repo-list { display: flex; flex-direction: column; gap: 15px; }

        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, border-color 0.2s;
        }
        .repo-card:hover { transform: translateY(-2px); border-color: var(--text-sub); }

        /* 排名勋章 */
        .rank-badge {
            font-size: 1.5rem; font-weight: 800; width: 40px; text-align: center;
            color: var(--text-sub); flex-shrink: 0; padding-top: 2px;
        }
        /* 前三名特效 */
        .repo-card[data-rank="1"] .rank-badge { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); font-size: 2rem; }
        .repo-card[data-rank="2"] .rank-badge { color: var(--silver); font-size: 1.8rem; }
        .repo-card[data-rank="3"] .rank-badge { color: var(--bronze); font-size: 1.8rem; }

        .content { flex-grow: 1; min-width: 0; }
        
        .repo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .repo-name { font-size: 1.2rem; font-weight: 600; color: var(--accent-blue); }
        .repo-desc { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 12px; }

        /* 底部数据栏 */
        .meta-row { display: flex; gap: 15px; font-size: 0.8rem; color: var(--text-sub); align-items: center; }
        .meta-item { display: flex; align-items: center; gap: 4px; }
        .lang-circle { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }

        /* 加载状态 */
        .loading { text-align: center; padding: 50px; color: var(--text-sub); }
        
        /* 手机适配 */
        @media (max-width: 600px) {
            .repo-card { flex-direction: column; gap: 10px; }
            .rank-badge { width: 100%; text-align: left; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title">
                <h1>🔥 GitHub Trending</h1>
                <p>Global Top Starred Repositories (Real-time)</p>
            </div>
            <a href="index.html" class="back-btn">Exit</a>
        </header>

        <div id="list" class="repo-list">
            <div class="loading">Loading top projects...</div>
        </div>
    </div>

    <script>
        // 编程语言颜色表
        const colors = {
            'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Vue': '#41b883', 'Python': '#3572A5',
            'Java': '#b07219', 'Go': '#00ADD8', 'C++': '#f34b7d', 'C': '#555555', 'HTML': '#e34c26'
        };

        async function loadTrending() {
            try {
                // 查询 GitHub API：按 star 数量倒序，取前 15 名
                // q=stars:>100000 筛选超级热门项目
                const res = await fetch('https://api.github.com/search/repositories?q=stars:>100000&sort=stars&order=desc&per_page=15');
                const data = await res.json();
                
                const container = document.getElementById('list');
                container.innerHTML = '';

                if (!data.items) {
                    container.innerHTML = '<div class="loading">API Rate Limit. Please try later.</div>';
                    return;
                }

                data.items.forEach((repo, i) => {
                    const rank = i + 1;
                    const langColor = colors[repo.language] || '#8b949e';
                    // 格式化数字 (例如 300000 -> 300k)
                    const stars = (repo.stargazers_count / 1000).toFixed(1) + 'k';
                    const forks = (repo.forks_count / 1000).toFixed(1) + 'k';

                    // 奖杯图标
                    let trophy = `#${rank}`;
                    if (rank === 1) trophy = '🏆';
                    if (rank === 2) trophy = '🥈';
                    if (rank === 3) trophy = '🥉';

                    const html = `
                        <a href="${repo.html_url}" target="_blank" class="repo-card" data-rank="${rank}">
                            <div class="rank-badge">${trophy}</div>
                            <div class="content">
                                <div class="repo-header">
                                    <span class="repo-name">${repo.full_name}</span>
                                </div>
                                <div class="repo-desc">${repo.description || 'No description.'}</div>
                                <div class="meta-row">
                                    <div class="meta-item" style="color:#E3B341">
                                        <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"></path></svg>
                                        ${stars}
                                    </div>
                                    <div class="meta-item">
                                        <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"></path></svg>
                                        ${forks}
                                    </div>
                                    <div class="meta-item">
                                        <span class="lang-circle" style="background:${langColor}"></span>
                                        ${repo.language || 'Unknown'}
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += html;
                });
            } catch (err) {
                document.getElementById('list').innerHTML = '<div class="loading">Failed to load.</div>';
            }
        }

        loadTrending();
    </script>

</body>
</html>
