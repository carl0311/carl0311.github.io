<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Louis | Workspace</title>
    <style>
        :root {
            /* --- 苹果风核心配色 --- */
            /* 背景：微妙的放射状渐变，不是纯死白 */
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f2f2f7 100%);
            
            /* 毛玻璃卡片核心 */
            --card-bg: rgba(255, 255, 255, 0.7); /* 半透明白色 */
            --card-border: rgba(255, 255, 255, 0.4); /* 极细微的边框 */
            --backdrop-blur: 25px; /* 模糊程度 */

            /* 文本颜色 */
            --text-primary: #1d1d1f; /* 深灰黑 */
            --text-secondary: #86868b; /* 次级灰 */

            /* --- 多彩强调色 (iOS风格渐变) --- */
            --gradient-blue: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-green: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --gradient-orange: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-purple: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --accent-blue-solid: #0071e3;

            /* --- 阴影与圆角 --- */
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(255,255,255,0.5);
            --shadow-hover: 0 20px 40px rgba(0,0,0,0.1);
            --radius-card: 28px;
            --radius-icon: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased; /* Mac字体平滑 */
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            /* 优先使用苹果系统字体，字间距稍微收紧以显精致 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: -0.02em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, minmax(120px, auto));
            gap: 24px; /* 更大的间距增加通透感 */
            max-width: 1000px;
            width: 100%;
        }

        /* --- 核心卡片样式 (毛玻璃) --- */
        .card {
            background-color: var(--card-bg);
            /* 关键：背景模糊滤镜 */
            backdrop-filter: blur(var(--backdrop-blur));
            -webkit-backdrop-filter: blur(var(--backdrop-blur)); /* Safari兼容 */
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 32px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* 苹果式的弹性过渡动画 */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: scale(1.03) translateY(-4px); /* 上浮并轻微放大 */
            box-shadow: var(--shadow-hover);
            background-color: rgba(255, 255, 255, 0.85); /* 悬停时稍微变亮不透明 */
        }

        /* --- 内容排版细节 --- */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.04em; /* 标题字间距更紧 */
            background: linear-gradient(120deg, #000000, #434343);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.03em;
        }
        
        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.4;
        }

        /* --- iOS风格图标容器 --- */
        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white; /* 图标统一为白色 */
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        /* 多彩渐变背景类 */
        .bg-blue { background: var(--gradient-blue); }
        .bg-green { background: var(--gradient-green); }
        .bg-orange { background: var(--gradient-orange); }
        .bg-purple { background: var(--gradient-purple); }

        /* --- 特殊卡片定制 --- */

        /* 1. 个人简介 */
        .card-profile {
            grid-column: span 2;
            grid-row: span 2;
            justify-content: center;
        }
        .tag {
            display: inline-block;
            font-size: 0.8rem;
            padding: 8px 16px;
            background: rgba(0, 113, 227, 0.1); /* 浅蓝色背景 */
            color: var(--accent-blue-solid);
            border-radius: 100px;
            font-weight: 600;
            margin-top: 20px;
        }

        /* 2. 工具卡片 */
        .card-tool {
            grid-column: span 1;
            grid-row: span 2;
        }
        .tool-mockup {
            flex-grow: 1;
            margin-top: 25px;
            background: rgba(255,255,255,0.9); /* 比卡片背景更不透明一点，突出层次 */
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }
        /* 模拟界面内部的横条 */
        .mockup-bar {
            height: 12px;
            background: #ECECEC;
            border-radius: 6px;
            margin: 15px 15px 0 15px;
            width: 60%;
        }
        .mockup-bar.short { width: 40%; }

        /* 3. 小方块 */
        .card-small {
            grid-column: span 1;
            grid-row: span 1;
            align-items: center;
            justify-content: center;
        }

        /* 4. 横长条 */
        .card-wide {
            grid-column: span 2;
            grid-row: span 1;
            flex-direction: row;
            align-items: center;
        }
        .arrow-btn {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent-blue-solid);
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            body { padding: 20px 15px; }
            .bento-grid { grid-template-columns: 1fr; gap: 20px; }
            .card { grid-column: span 1 !important; grid-row: span 1 !important; min-height: 180px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="bento-grid">
        <div class="card card-profile">
            <div>
                <h1>Carl Louis.</h1>
                <p class="card-desc" style="font-size: 1.1rem; margin-top: 8px;">
                    Creating digital experiences &<br>exploring the unknown.
                </p>
                <span class="tag"> Developer & Writer</span>
            </div>
        </div>

        <a href="./phone-validator.html" class="card card-tool">
            <div>
                <div class="icon-box bg-blue">📱</div>
                <div class="card-title">号码验证</div>
                <div class="card-desc">数据清洗与格式化</div>
            </div>
            <div class="tool-mockup">
                <div class="mockup-bar"></div>
                <div class="mockup-bar short"></div>
            </div>
        </a>

        <a href="./translator.html" class="card card-tool">
            <div>
                <div class="icon-box bg-green">🌏</div>
                <div class="card-title">智能翻译</div>
                <div class="card-desc">多语言即时转换</div>
            </div>
            <div class="tool-mockup" style="background: rgba(52, 199, 89, 0.1);">
                <div class="mockup-bar" style="background: rgba(52, 199, 89, 0.2);"></div>
                <div class="mockup-bar short" style="background: rgba(52, 199, 89, 0.2);"></div>
            </div>
        </a>

        <div class="card card-small">
            <div class="icon-box bg-orange" style="margin-bottom: 0; width: 60px; height: 60px; font-size: 32px;">☕️</div>
        </div>

        <div class="card card-small">
            <div class="icon-box bg-purple" style="margin-bottom: 0; width: 60px; height: 60px; font-size: 32px;">🖊️</div>
        </div>

        <div class="card card-wide">
            <div style="flex-grow: 1;">
                <div class="card-title">Project: Novel</div>
                <div class="card-desc">关于古墓与超自然的构思</div>
            </div>
            <div class="arrow-btn">→</div>
        </div>
        
        <a href="mailto:your@email.com" class="card card-wide">
             <div style="flex-grow: 1;">
                <div class="card-title">Get in Touch</div>
                <div class="card-desc">合作与交流</div>
            </div>
            <div class="arrow-btn" style="color: var(--text-primary);">✉️</div>
        </a>

    </div>

</body>
</html>
