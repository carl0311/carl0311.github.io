<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Sentry | 智能记忆版</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --input-bg: #334155;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --accent-blue: #38BDF8;
            --accent-green: #34C759;
            --border: #475569;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 顶部 --- */
        header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, #38BDF8, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-sub); font-size: 0.9rem; margin-top: 5px; }

        /* --- 历史记录栏 --- */
        .history-bar {
            width: 100%; max-width: 1100px;
            display: flex; gap: 10px; overflow-x: auto;
            padding-bottom: 10px; margin-bottom: 20px;
            scrollbar-width: thin;
        }
        .history-tag {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 6px 12px; border-radius: 100px;
            font-size: 0.8rem; white-space: nowrap; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .history-tag:hover { background: var(--accent-blue); color: #0F172A; }

        /* --- 主控制台 --- */
        .console-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            width: 100%; max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: grid; grid-template-columns: 3fr 1fr; gap: 20px;
            position: relative;
        }

        .input-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }

        /* 带复制按钮的输入框容器 */
        .input-group { position: relative; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--accent-blue); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        
        input {
            width: 100%; background: var(--input-bg);
            border: 1px solid var(--border); padding: 12px 40px 12px 12px; /* 右侧留空给复制按钮 */
            border-radius: 8px; color: white; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        /* 复制按钮 */
        .copy-btn {
            position: absolute; right: 8px; top: 32px; /* 调整位置 */
            background: transparent; border: none;
            color: #64748B; cursor: pointer; font-size: 1rem;
            transition: 0.2s; padding: 4px; border-radius: 4px;
        }
        .copy-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }
        .copy-btn:active { transform: scale(0.9); }

        /* 提示气泡 */
        .tooltip {
            position: absolute; right: 0; top: 0;
            background: var(--accent-green); color: #064E3B;
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }

        /* 操作区 */
        .action-area { display: flex; flex-direction: column; gap: 10px; }
        
        .btn-scan {
            flex-grow: 1; width: 100%;
            background: linear-gradient(135deg, #38BDF8 0%, #2563EB 100%);
            border: none; border-radius: 8px;
            color: white; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }

        .btn-reset {
            padding: 10px; background: transparent; border: 1px solid var(--border);
            color: var(--text-sub); border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-reset:hover { border-color: #F87171; color: #F87171; }

        /* --- 仪表盘 --- */
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; width: 100%; max-width: 1100px;
            opacity: 0.4; pointer-events: none; transition: 0.5s;
            margin-bottom: 30px;
        }
        .dashboard-grid.active { opacity: 1; pointer-events: all; }

        .tool-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px;
        }

        .card-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            padding-bottom: 10px; border-bottom: 1px solid var(--border);
        }
        .card-title { font-weight: 700; color: #E2E8F0; }
        .card-sub { font-size: 0.75rem; color: #64748B; display: block; }

        .search-link {
            display: flex; align-items: center; justify-content: space-between;
            background: #283548; padding: 10px 14px;
            border-radius: 6px; text-decoration: none;
            color: var(--text-sub); font-size: 0.85rem;
            transition: 0.2s; margin-bottom: 8px; border: 1px solid transparent;
        }
        .search-link:hover { background: #334155; color: white; border-color: var(--accent-blue); transform: translateX(3px); }
        .tag { font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; background: rgba(255,255,255,0.1); }
        .tag.risk { color: #F87171; background: rgba(248, 113, 113, 0.1); }

        /* --- 报告区 --- */
        .report-section {
            width: 100%; max-width: 1100px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 25px;
            display: none; animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        textarea {
            width: 100%; height: 200px;
            background: #0F172A; border: 1px solid var(--border);
            border-radius: 8px; padding: 15px;
            color: var(--text-main); font-family: monospace; font-size: 0.9rem;
            resize: vertical; outline: none; margin-bottom: 15px;
        }
        textarea:focus { border-color: var(--accent-green); }

        .btn-export {
            background: var(--accent-green); color: #064E3B;
            border: none; padding: 10px 20px; border-radius: 6px;
            font-weight: 700; cursor: pointer;
        }

        .back-home { margin-top: 20px; color: var(--text-sub); text-decoration: none; font-size: 0.9rem; }
        .back-home:hover { color: white; }

        @media (max-width: 768px) {
            .console-panel { grid-template-columns: 1fr; }
            .input-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🕵️‍♂️</div>
        <h1>Trade Sentry <span style="font-size:1rem; opacity:0.7; font-weight:400;">Memory</span></h1>
        <p class="subtitle">Auto-saving Background Investigation Tool</p>
    </header>

    <div class="history-bar" id="historyBar">
        <div style="color:#666; font-size:0.8rem; padding:5px;">History...</div>
    </div>

    <div class="console-panel">
        <div class="input-grid">
            
            <div class="input-group">
                <label>Target Company</label>
                <input type="text" id="company" placeholder="e.g. Tesla Inc" oninput="saveDraft()">

                <div id="tip-company" class="tooltip">Copied!</div>
            </div>

            <div class="input-group">
                <label>Website Domain</label>
                <input type="text" id="domain" placeholder="e.g. tesla.com" oninput="saveDraft()">

                <div id="tip-domain" class="tooltip">Copied!</div>
            </div>

            <div class="input-group">
                <label>Key Person</label>
                <input type="text" id="name" placeholder="e.g. Elon Musk" oninput="saveDraft()">
                <button class="copy-btn" onclick="copyInput('name')" title="Copy">📋</button>
                <div id="tip-name" class="tooltip">Copied!</div>
            </div>

            <div class="input-group">
                <label>Phone / Email</label>
                <input type="text" id="contact" placeholder="Email or Phone" oninput="saveDraft()">
                <button class="copy-btn" onclick="copyInput('contact')" title="Copy">📋</button>
                <div id="tip-contact" class="tooltip">Copied!</div>
            </div>

        </div>
        <div class="action-area">
            <button class="btn-scan" onclick="startInvestigation()">
                🚀 GENERATE LINKS
            </button>
            <button class="btn-reset" onclick="clearAll()">
                🗑️ Reset
            </button>
        </div>
    </div>

    <div class="dashboard-grid" id="dashboard">
        
        <div class="tool-card">
            <div class="card-header">
                <span style="font-size:1.5rem;">🏢</span>
                <div><div class="card-title">Corporate & Risk</div><span class="card-sub">工商 / 风险</span></div>
            </div>
            <a href="#" id="lk-google" target="_blank" class="search-link"><span>Google Files (PDF)</span><span class="tag">Dorks</span></a>
            <a href="#" id="lk-opencorp" target="_blank" class="search-link"><span>OpenCorporates</span><span class="tag">Reg</span></a>
            <a href="#" id="lk-whois" target="_blank" class="search-link"><span>Whois Domain</span><span class="tag risk">Risk</span></a>
            <a href="#" id="lk-scam" target="_blank" class="search-link"><span>Scam Check</span><span class="tag risk">Risk</span></a>
        </div>

        <div class="tool-card">
            <div class="card-header">
                <span style="font-size:1.5rem;">👥</span>
                <div><div class="card-title">Decision Maker</div><span class="card-sub">老板 / 采购</span></div>
