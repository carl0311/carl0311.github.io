<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Validator | Carl Louis</title>
    <script src="https://unpkg.com/libphonenumber-js@1.10.44/bundle/libphonenumber-min.js"></script>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent-blue: #0071E3;
            --accent-green: #34C759;
            --accent-red: #FF3B30;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 12px 40px rgba(0,0,0,0.08);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 550px; }

        /* --- 主卡片 --- */
        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        /* --- 顶部切换器 (Segmented Control) --- */
        .switcher {
            display: flex;
            background: #F2F2F7;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 35px;
            position: relative;
        }

        .switch-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .switch-btn.active {
            color: var(--text-main);
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* --- 内容区域动画 --- */
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 标题 --- */
        .header { text-align: center; margin-bottom: 30px; }
        .icon { font-size: 3rem; margin-bottom: 15px; display: block; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        p { color: var(--text-sub); font-size: 0.9rem; }

        /* --- 输入框通用 --- */
        .input-group { position: relative; margin-bottom: 25px; }
        
        input {
            width: 100%; padding: 16px 20px;
            border-radius: 12px; border: 2px solid transparent;
            background: #F2F2F7;
            font-size: 1.1rem; color: var(--text-main);
            outline: none; transition: 0.3s;
        }
        input:focus { background: white; border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }

        .btn-action {
            width: 100%; padding: 16px;
            border-radius: 12px; border: none;
            background: var(--accent-blue);
            color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,113,227,0.3); }

        /* --- 结果展示 --- */
        .result-box {
            margin-top: 25px; padding: 20px;
            background: #F9F9F9; border-radius: 16px;
            display: none; border: 1px solid var(--border);
        }
        
        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .result-row:last-child { margin-bottom: 0; }
        .label { color: var(--text-sub); }
        .value { font-weight: 600; color: var(--text-main); text-align: right; }
        
        .valid-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
        .is-valid { background: #D1FAE5; color: #065F46; }
        .is-invalid { background: #FEE2E2; color: #991B1B; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-sub); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--accent-blue); }

    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <div class="switcher">
                <div class="switch-btn active" onclick="switchTab('phone')">Phone 号码</div>
                <div class="switch-btn" onclick="switchTab('email')">Email 邮箱</div>
            </div>

            <div id="tab-phone" class="tab-content active">
                <div class="header">
                    <span class="icon">📱</span>
                    <h1>Phone Validator</h1>
                    <p>国际号码格式化与归属地解析</p>
                </div>
                
                <div class="input-group">
                    <input type="text" id="phoneInput" placeholder="+86 13800138000" onkeypress="handleEnter(event, 'phone')">
                </div>
                <button class="btn-action" onclick="verifyPhone()">解析号码</button>

                <div id="result-phone" class="result-box">
                    <div class="result-row">
                        <span class="label">状态</span>
                        <span id="p-valid" class="valid-badge">Unknown</span>
                    </div>
                    <div class="result-row">
                        <span class="label">国家/地区</span>
                        <span id="p-country" class="value">--</span>
                    </div>
                    <div class="result-row">
                        <span class="label">国际格式</span>
                        <span id="p-intl" class="value">--</span>
                    </div>
                    <div class="result-row">
                        <span class="label">运营商/类型</span>
                        <span id="p-type" class="value">--</span>
                    </div>
                </div>
            </div>

            <div id="tab-email" class="tab-content">
                <div class="header">
                    <span class="icon">✉️</span>
                    <h1>Email Validator</h1>
                    <p>域名有效性与 MX 记录深度检测</p>
                </div>

                <div class="input-group">
                    <input type="email" id="emailInput" placeholder="name@company.com" onkeypress="handleEnter(event, 'email')">
                </div>
                <button class="btn-action" id="btn-email" onclick="verifyEmail()">验证邮箱</button>

                <div id="result-email" class="result-box">
                    <div class="result-row">
                        <span class="label">综合结论</span>
                        <span id="e-valid" class="valid-badge">--</span>
                    </div>
                    <div class="result-row">
                        <span class="label">格式检查</span>
                        <span id="e-syntax" class="value">--</span>
                    </div>
                    <div class="result-row">
                        <span class="label">临时邮箱检测</span>
                        <span id="e-disposable" class="value">--</span>
                    </div>
                    <div class="result-row">
                        <span class="label">MX 记录 (Google DNS)</span>
                        <span id="e-mx" class="value">--</span>
                    </div>
                </div>
            </div>

            <a href="index.html" class="back-link">← Back to Workspace</a>
        </div>
    </div>

    <script>
        // --- 切换逻辑 ---
        function switchTab(tab) {
            // 切换按钮样式
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 切换内容显示
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function handleEnter(e, type) {
            if(e.key === 'Enter') {
                if(type === 'phone') verifyPhone();
                else verifyEmail();
            }
        }

        // --- 1. 手机验证逻辑 (使用 libphonenumber-js) ---
        function verifyPhone() {
            const input = document.getElementById('phoneInput').value;
            const resultBox = document.getElementById('result-phone');
            const validBadge = document.getElementById('p-valid');
            
            resultBox.style.display = 'block';

            try {
                // 解析号码 (默认尝试解析，如果没有+号且像中国号码，可以默认CN，这里为了通用不预设)
                const phoneNumber = libphonenumber.parsePhoneNumber(input);
                
                if (phoneNumber && phoneNumber.isValid()) {
                    validBadge.textContent = "有效号码 (Valid)";
                    validBadge.className = "valid-badge is-valid";
                    
                    document.getElementById('p-country').textContent = `${phoneNumber.country} (Region)`;
                    document.getElementById('p-intl').textContent = phoneNumber.formatInternational();
                    document.getElementById('p-type').textContent = "Mobile/Fixed"; // 基础库只能粗略判断
                } else {
                    throw new Error("Invalid");
                }
            } catch (e) {
                validBadge.textContent = "无效号码 (Invalid)";
                validBadge.className = "valid-badge is-invalid";
                document.getElementById('p-country').textContent = "--";
                document.getElementById('p-intl').textContent = "--";
                document.getElementById('p-type').textContent = "--";
            }
        }

        // --- 2. 邮箱验证逻辑 (DNS版) ---
        const DISPOSABLE_DOMAINS = ['10minutemail.com', 'mailinator.com', 'temp-mail.org', 'yopmail.com'];

        async function verifyEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('btn-email');
            const resultBox = document.getElementById('result-email');
            
            if (!email) return alert("请输入邮箱");
            
            btn.disabled = true;
            btn.textContent = "Checking...";
            resultBox.style.display = 'block';
            
            // 1. 格式
            const syntaxValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            document.getElementById('e-syntax').innerHTML = syntaxValid ? "✅ Pass" : "❌ Fail";
            
            if (!syntaxValid) {
                finalizeEmail(false, "格式错误");
                return;
            }

            // 2. 临时邮箱
            const domain = email.split('@')[1].toLowerCase();
            const isDisposable = DISPOSABLE_DOMAINS.includes(domain);
            document.getElementById('e-disposable').innerHTML = isDisposable ? "❌ Detected" : "✅ Clean";

            if (isDisposable) {
                finalizeEmail(false, "临时一次性邮箱");
                return;
            }

            // 3. MX 记录
            try {
                const res = await fetch(`https://dns.google/resolve?name=${domain}&type=MX`);
                const data = await res.json();
                
                if (data.Status === 0 && data.Answer && data.Answer.length > 0) {
                    document.getElementById('e-mx').innerHTML = "✅ Active";
                    finalizeEmail(true, "服务可用");
                } else {
                    document.getElementById('e-mx').innerHTML = "❌ No Server";
                    finalizeEmail(false, "无邮件服务");
                }
            } catch (e) {
                document.getElementById('e-mx').innerHTML = "⚠️ Network Error";
                finalizeEmail(true, "格式正确 (网络受限)");
            }
        }

        function finalizeEmail(isValid, msg) {
            const badge = document.getElementById('e-valid');
            badge.textContent = msg;
            badge.className = `valid-badge ${isValid ? 'is-valid' : 'is-invalid'}`;
            
            const btn = document.getElementById('btn-email');
            btn.disabled = false;
            btn.textContent = "验证邮箱";
        }
    </script>

</body>
</html>
