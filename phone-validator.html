<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO 3166-1 全量电话解析专家</title>
    <script src="https://unpkg.com/libphonenumber-js@1.10.44/bundle/libphonenumber-js.min.js"></script>
    <style>
        :root {
            --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e;
            --text-sub: #8e8e93; --primary: #007aff; --success: #34c759;
            --danger: #ff3b30; --border: #d1d1d6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000; --card-bg: #1c1c1e; --text-main: #ffffff;
                --text-sub: #aeaeb2; --border: #38383a;
            }
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; transition: 0.3s; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-sub); font-weight: 700; }
        input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 14px; box-sizing: border-box; font-size: 17px; background: rgba(150,150,150,0.05); color: var(--text-main); outline: none; }
        input:focus { border-color: var(--primary); }
        .result-container { display: none; animation: slideUp 0.4s ease; }
        .status-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 15px; border-radius: 14px; }
        .status-header.valid { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .status-header.invalid { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
        .info-card { background: rgba(150,150,150,0.05); border-radius: 14px; overflow: hidden; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .row:last-child { border-bottom: none; }
        .label { font-size: 14px; color: var(--text-sub); }
        .val { font-size: 15px; font-weight: 500; text-align: right; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #toast { position: fixed; bottom: 30px; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <header>
        <h2>全球号码深度验证</h2>
        <button style="background:none; border:none; color:var(--primary); cursor:pointer;" onclick="location.reload()">重置</button>
    </header>
    
    <div class="input-group">
        <label>1. 选择 ISO 3166-1 国家/地区</label>
        <input list="country-list" id="country-input" placeholder="🔍 输入中文名、英文名或二位代码（如 CN）" onfocus="this.value=''">
        <datalist id="country-list"></datalist>
    </div>

    <div class="input-group">
        <label>2. 电话号码</label>
        <input type="tel" id="phone" placeholder="输入待验证号码" autocomplete="off">
    </div>

    <div id="result" class="result-container">
        <div id="status-box" class="status-header">
            <span id="status-icon" style="font-size: 24px;"></span>
            <div id="status-text" style="font-weight: 800;"></div>
        </div>
        <div class="info-card" id="details"></div>
    </div>
</div>

<div id="toast">已复制</div>

<script>
    // 依据 ISO 3166-1 标准整理的全量数据 (含全部正式分配代码)
    const isoData = {
        "AF":"阿富汗","AX":"奥兰群岛","AL":"阿尔巴尼亚","DZ":"阿尔及利亚","AS":"美属萨摩亚","AD":"安道尔","AO":"安哥拉","AI":"安圭拉","AQ":"南极洲","AG":"安提瓜和巴布达","AR":"阿根廷","AM":"亚美尼亚","AW":"阿鲁巴","AU":"澳大利亚","AT":"奥地利","AZ":"阿塞拜疆","BS":"巴哈马","BH":"巴林","BD":"孟加拉国","BB":"巴巴多斯","BY":"白俄罗斯","BE":"比利时","BZ":"伯利兹","BJ":"贝宁","BM":"百慕大","BT":"不丹","BO":"玻利维亚","BA":"波黑","BW":"博茨瓦纳","BV":"布韦岛","BR":"巴西","IO":"英属印度洋领地","BN":"文莱","BG":"保加利亚","BF":"布基纳法索","BI":"布隆迪","KH":"柬埔寨","CM":"喀麦隆","CA":"加拿大","CV":"佛得角","KY":"开曼群岛","CF":"中非共和国","TD":"乍得","CL":"智利","CN":"中国","CX":"圣诞岛","CC":"科科斯群岛","CO":"哥伦比亚","KM":"科摩罗","CG":"刚果（布）","CD":"刚果（金）","CK":"库克群岛","CR":"哥斯达黎加","CI":"科特迪瓦","HR":"克罗地亚","CU":"古巴","CW":"库拉索","CY":"塞浦路斯","CZ":"捷克","DK":"丹麦","DJ":"吉布提","DM":"多米尼克","DO":"多米尼加共和国","EC":"厄瓜多尔","EG":"埃及","SV":"萨尔瓦多","GQ":"赤道几内亚","ER":"厄立特里亚","EE":"爱沙尼亚","ET":"埃塞俄比亚","FK":"福克兰群岛","FO":"法罗群岛","FJ":"斐济","FI":"芬兰","FR":"法国","GF":"法属圭亚那","PF":"法属波利尼西亚","TF":"法属南部领地","GA":"加蓬","GM":"冈比亚","GE":"格鲁吉亚","DE":"德国","GH":"加纳","GI":"直布罗陀","GR":"希腊","GL":"格陵兰","GD":"格林纳达","GP":"瓜德罗普","GU":"关岛","GT":"危地马拉","GG":"根西岛","GN":"几内亚","GW":"几内亚比绍","GY":"圭亚那","HT":"海地","HM":"赫德岛和麦克唐纳群岛","VA":"梵蒂冈","HN":"洪都拉斯","HK":"中国香港","HU":"匈牙利","IS":"冰岛","IN":"印度","ID":"印度尼西亚","IR":"伊朗","IQ":"伊拉克","IE":"爱尔兰","IM":"马恩岛","IL":"以色列","IT":"意大利","JM":"牙买加","JP":"日本","JE":"泽西岛","JO":"约旦","KZ":"哈萨克斯坦","KE":"肯尼亚","KI":"基里巴斯","KP":"朝鲜","KR":"韩国","KW":"科威特","KG":"吉尔吉斯斯坦","LA":"老挝","LV":"拉脱维亚","LB":"黎巴嫩","LS":"莱索托","LR":"利比里亚","LY":"利比亚","LI":"列支敦士登","LT":"立陶宛","LU":"卢森堡","MO":"中国澳门","MK":"北马其顿","MG":"马达加斯加","MW":"马拉维","MY":"马来西亚","MV":"马尔代夫","ML":"马里","MT":"马耳他","MH":"马绍尔群岛","MQ":"马提尼克","MR":"毛里塔尼亚","MU":"毛里求斯","YT":"马约特","MX":"墨西哥","FM":"密克罗尼西亚","MD":"摩尔多瓦","MC":"摩纳哥","MN":"蒙古","ME":"黑山","MS":"蒙特塞拉特","MA":"摩洛哥","MZ":"莫桑比克","MM":"缅甸","NA":"纳米比亚","NR":"瑙鲁","NP":"尼泊尔","NL":"荷兰","NC":"新喀里多尼亚","NZ":"新西兰","NI":"尼加拉瓜","NE":"尼日尔","NG":"尼日利亚","NU":"纽埃","NF":"诺福克岛","MP":"北马里亚纳群岛","NO":"挪威","OM":"阿曼","PK":"巴基斯坦","PW":"帛琉","PS":"巴勒斯坦","PA":"巴拿马","PG":"巴布亚新几内亚","PY":"巴拉圭","PE":"秘鲁","PH":"菲律宾","PN":"皮特凯恩","PL":"波兰","PT":"葡萄牙","PR":"波多黎各","QA":"卡塔尔","RE":"留尼汪","RO":"罗马尼亚","RU":"俄罗斯","RW":"卢旺达","BL":"圣巴泰勒米","SH":"圣赫勒拿","KN":"圣基茨和尼维斯","LC":"圣卢西亚","MF":"圣马丁","PM":"圣皮埃尔和密克隆","VC":"圣文森特和格林纳丁斯","WS":"萨摩亚","SM":"圣马力诺","ST":"圣多美和普林西比","SA":"沙特阿拉伯","SN":"塞内加尔","RS":"塞尔维亚","SC":"塞舌尔","SL":"塞拉利昂","SG":"新加坡","SX":"荷属圣马丁","SK":"斯洛伐克","SI":"斯洛文尼亚","SB":"所罗门群岛","SO":"索马里","ZA":"南非","GS":"南乔治亚和南桑威奇群岛","SS":"南苏丹","ES":"西班牙","LK":"斯里兰卡","SD":"苏丹","SR":"苏里南","SJ":"斯瓦尔巴和扬马延","SZ":"斯威士兰","SE":"瑞典","CH":"瑞士","SY":"叙利亚","TW":"中国台湾","TJ":"塔吉克斯坦","TZ":"坦桑尼亚","TH":"泰国","TL":"东帝汶","TG":"多哥","TK":"托克劳","TO":"汤加","TT":"特立尼达和多巴哥","TN":"突尼斯","TR":"土耳其","TM":"土库曼斯坦","TC":"特克斯和凯科斯群岛","TV":"图瓦卢","UG":"乌干达","UA":"乌克兰","AE":"阿联酋","GB":"英国","US":"美国","UM":"美国本土外小岛屿","UY":"乌拉圭","UZ":"乌兹别克斯坦","VU":"瓦努阿图","VE":"委内瑞拉","VN":"越南","VG":"英属维尔京群岛","VI":"美属维尔京群岛","WF":"瓦利斯和富图纳","EH":"西撒哈拉","YE":"也门","ZM":"赞比亚","ZW":"津巴布韦"
    };

    // 辅助函数：通过代码生成国旗 Emoji
    function getFlagEmoji(countryCode) {
        return countryCode.toUpperCase().replace(/./g, char => 
            String.fromCodePoint(char.charCodeAt(0) + 127397)
        );
    }

    // 初始化下拉列表
    const datalist = document.getElementById('country-list');
    Object.entries(isoData).forEach(([code, name]) => {
        const opt = document.createElement('option');
        const flag = getFlagEmoji(code);
        opt.value = `${flag} ${name} (${code})`;
        datalist.appendChild(opt);
    });

    const phoneInp = document.getElementById('phone');
    const countryInp = document.getElementById('country-input');
    const resDiv = document.getElementById('result');

    function copyText(text) {
        navigator.clipboard.writeText(text);
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 1500);
    }

    function run() {
        const num = phoneInp.value.trim();
        const match = countryInp.value.match(/\(([A-Z]{2})\)/);
        const region = match ? match[1] : null;

        if(!num) { resDiv.style.display = 'none'; return; }
        
        try {
            const p = libphonenumber.parsePhoneNumberFromString(num, region);
            resDiv.style.display = 'block';
            const statusBox = document.getElementById('status-box');
            const details = document.getElementById('details');

            if (p && p.isValid()) {
                statusBox.className = 'status-header valid';
                document.getElementById('status-icon').innerText = '✅';
                document.getElementById('status-text').innerText = '号码真实有效';
            } else if (p && p.isPossible()) {
                statusBox.className = 'status-header invalid';
                document.getElementById('status-icon').innerText = '⚠️';
                document.getElementById('status-text').innerText = '格式正确但未分配';
            } else {
                statusBox.className = 'status-header invalid';
                document.getElementById('status-icon').innerText = '❌';
                document.getElementById('status-text').innerText = '无效号码';
            }

            if(p) {
                const cName = isoData[p.country] || p.country;
                const typeMap = { 'MOBILE':'移动', 'FIXED_LINE':'座机', 'VOIP':'VOIP', 'TOLL_FREE':'免费' };
                details.innerHTML = `
                    <div class="row" onclick="copyText('${p.formatInternational()}')"><span class="label">国际格式</span><span class="val">${p.formatInternational()}</span></div>
                    <div class="row" onclick="copyText('${p.format('E.164')}')"><span class="label">E.164标准</span><span class="val">${p.format('E.164')}</span></div>
                    <div class="row"><span class="label">归属地</span><span class="val">${getFlagEmoji(p.country)} ${cName}</span></div>
                    <div class="row"><span class="label">拨号代码</span><span class="val">+${p.countryCallingCode}</span></div>
                    <div class="row"><span class="label">类型</span><span class="val">${typeMap[p.getType()] || '其他'}</span></div>
                `;
            }
        } catch (e) { console.error(e); }
    }

    phoneInp.addEventListener('input', run);
    countryInp.addEventListener('input', run);
</script>

</body>
</html>
