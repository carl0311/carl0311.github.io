<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Top 100 | Carl Louis</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --col-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent-blue: #0071E3;
            --accent-fire: #FF3B30;
            --accent-fork: #5856D6;
            --accent-trend: #34C759;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 禁止整页滚动，只允许列滚动 */
        }

        /* --- 顶部导航 --- */
        header {
            padding: 20px 30px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title h1 { font-size: 1.5rem; font-weight: 800; }
        .header-title p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }

        .back-btn {
            text-decoration: none; color: var(--text-main); font-weight: 600;
            padding: 8px 16px; background: white; border-radius: 100px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 0.9rem;
            transition: 0.2s;
        }
        .back-btn:hover { transform: scale(1.05); }

        /* --- 三列布局容器 --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 三等分 */
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
            min-height: 0; /* 关键：允许子元素滚动 */
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* 每一列的容器 */
        .column {
            background: var(--col-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* 列标题 */
        .col-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.9);
            position: sticky; top: 0; z-index: 2;
        }
        .col-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .col-subtitle { font-size: 0.8rem; color: var(--text-sub); margin-top: 5px; }

        /* 滚动列表区域 */
        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        /* 隐藏滚动条但保留功能 */
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 3px; }

        /* --- 项目卡片 --- */
        .item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-main);
            transition: background 0.2s;
            border-radius: 8px;
        }
        .item:hover { background: #F5F7FA; }

        /* 排名数字 */
        .rank {
            font-size: 1.2rem; font-weight: 800; color: #D1D1D6;
            min-width: 30px; text-align: center; margin-top: 2px;
        }
        /* 前三名颜色 */
        .item:nth-child(1) .rank { color: #FFD700; }
        .item:nth-child(2) .rank { color: #C0C0C0; }
        .item:nth-child(3) .rank { color: #CD7F32; }

        .content { flex: 1; min-width: 0; }
        .repo-name { font-size: 0.95rem; font-weight: 700; color: var(--accent-blue); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .repo-desc { 
            font-size: 0.8rem; color: var(--text-sub); line-height: 1.4; 
            margin-bottom: 8px; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; /* 最多显示2行 */
        }

        .meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); }
        .stat-badge { font-weight: 600; display: flex; align-items: center; gap: 4px; }
        
        .loading { text-align: center; padding: 40px; color: var(--text-sub); font-size: 0.9rem; }

        /* 移动端适配：变为竖向排列 */
        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .dashboard { grid-template-columns: 1fr; overflow: visible; }
            .column { height: 600px; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>GitHub Top 100 🚀</h1>
            <p>全网开源项目实时监控看板 (Top 100/Column)</p>
        </div>
        <a href="index.html" class="back-btn">Close</a>
    </header>

    <div class="dashboard">
        
        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fire);">🔥 最多星星 (Most Stars)</div>
                <div class="col-subtitle">历史累计 Star 数最高的殿堂级项目</div>
            </div>
            <div class="list-container" id="col-stars">
                <div class="loading">正在加载 Top 100...</div>
            </div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fork);">⚡️ 最受欢迎 (Most Forks)</div>
                <div class="col-subtitle">被引用、复制和学习次数最多的项目</div>
            </div>
            <div class="list-container" id="col-forks">
                <div class="loading">正在加载 Top 100...</div>
            </div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-trend);">🚀 飙升最快 (Skyrocketing)</div>
                <div class="col-subtitle">最近 30 天内创建且爆火的新项目</div>
            </div>
            <div class="list-container" id="col-trend">
                <div class="loading">正在加载 Top 100...</div>
            </div>
        </div>

    </div>

    <script>
        // --- 简单的“中文化”替换字典 ---
        // GitHub API 不提供中文，我们用 JS 简单替换常见的技术词汇，让界面看起来更像中文
        function translateDesc(text) {
            if (!text) return "暂无简介";
            let cn = text;
            cn = cn.replace(/A declarative, efficient, and flexible JavaScript library/gi, "一个高效、灵活的 JS 库");
            cn = cn.replace(/framework/gi, "框架");
            cn = cn.replace(/library/gi, "库");
            cn = cn.replace(/collection/gi, "合集");
            cn = cn.replace(/guide/gi, "指南");
            cn = cn.replace(/tutorial/gi, "教程");
            cn = cn.replace(/tool/gi, "工具");
            cn = cn.replace(/for building/gi, "用于构建");
            cn = cn.replace(/Open Source/gi, "开源");
            cn = cn.replace(/interview/gi, "面试");
            cn = cn.replace(/roadmap/gi, "路线图");
            cn = cn.replace(/system/gi, "系统");
            return cn;
        }

        // --- 通用渲染函数 ---
        function renderList(containerId, items, icon, color) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            items.forEach((repo, index) => {
                const rank = index + 1;
                const starCount = (repo.stargazers_count / 1000).toFixed(1) + 'k';
                const lang = repo.language || 'Code';
                const desc = translateDesc(repo.description);

                const html = `
                    <a href="${repo.html_url}" target="_blank" class="item">
                        <div class="rank">${rank}</div>
                        <div class="content">
                            <div class="repo-name">${repo.name}</div>
                            <div class="repo-desc">${desc}</div>
                            <div class="meta">
                                <span class="stat-badge" style="color:${color}">
                                    ${icon} ${starCount}
                                </span>
                                <span>${lang}</span>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += html;
            });
        }

        // --- 1. 获取最多星星 (Stars) ---
        async function fetchMostStars() {
            try {
                // per_page=100 拿满100个
                const res = await fetch('https://api.github.com/search/repositories?q=stars:>1000&sort=stars&per_page=100');
                const data = await res.json();
                renderList('col-stars', data.items, '★', '#FF3B30');
            } catch (e) {
                console.error(e);
            }
        }

        // --- 2. 获取最多 Forks (Popular) ---
        async function fetchMostForks() {
            try {
                const res = await fetch('https://api.github.com/search/repositories?q=forks:>1000&sort=forks&per_page=100');
                const data = await res.json();
                renderList('col-forks', data.items, '⚡️', '#5856D6');
            } catch (e) {
                console.error(e);
            }
        }

        // --- 3. 获取飙升最快 (Trending New) ---
        // 逻辑：搜索 "最近30天创建" 的项目，并按 Star 排序
        async function fetchTrending() {
            try {
                // 计算30天前的日期
                const date = new Date();
                date.setDate(date.getDate() - 30);
                const dateString = date.toISOString().split('T')[0]; // YYYY-MM-DD

                const res = await fetch(`https://api.github.com/search/repositories?q=created:>${dateString}&sort=stars&per_page=100`);
                const data = await res.json();
                renderList('col-trend', data.items, '🚀', '#34C759');
            } catch (e) {
                console.error(e);
            }
        }

        // --- 执行加载 ---
        // 为了防止同时触发 GitHub API 限制 (60次/小时)，我们稍微延时错开请求
        fetchMostStars();
        setTimeout(fetchMostForks, 1000);
        setTimeout(fetchTrending, 2000);

    </script>

</body>
</html>
