<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Top 100 | AI 实时翻译版</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --col-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent-blue: #0071E3;
            --accent-fire: #FF3B30;
            --accent-fork: #5856D6;
            --accent-trend: #34C759;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
            --cn-bg: #F2F2F7;
            --cn-text: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 25px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .header-desc { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
        
        /* 顶部操作区 */
        .header-actions { display: flex; align-items: center; gap: 10px; }

        /* 模型输入框 (自由输入+提示) */
        .model-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .model-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            font-size: 0.8rem;
            width: 260px; /* 稍微宽一点以显示长ID */
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .model-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }

        .btn {
            text-decoration: none; color: var(--text-main); font-weight: 600;
            padding: 8px 16px; background: white; border-radius: 8px;
            border: 1px solid var(--border); cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-size: 0.8rem; transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn:hover { background: #f5f5f5; transform: translateY(-1px); }
        .btn-key { color: var(--accent-blue); }

        /* --- Dashboard --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
            min-height: 0;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        .column {
            background: var(--col-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .col-header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.98);
            position: sticky; top: 0; z-index: 2;
        }
        
        .col-title { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .col-subtitle { font-size: 0.8rem; color: var(--text-sub); display: block; line-height: 1.4; }

        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 3px; }

        /* --- Item Card --- */
        .item {
            display: flex; gap: 14px; padding: 16px;
            border-bottom: 1px solid var(--border);
            text-decoration: none; color: var(--text-main);
            transition: all 0.2s; border-radius: 10px;
            position: relative;
        }
        .item:hover { background: #F5F7FA; transform: scale(0.995); }

        .rank-box {
            display: flex; flex-direction: column; align-items: center; min-width: 40px; padding-top: 2px;
        }
        .rank { font-size: 1.4rem; font-weight: 900; color: #D1D1D6; line-height: 1; font-variant-numeric: tabular-nums; }
        .rank-label { font-size: 0.65rem; color: #999; margin-top: 4px; text-transform: uppercase; font-weight: 700; }

        .item:nth-child(1) .rank { color: #FFD700; text-shadow: 0 2px 10px rgba(255,215,0,0.4); }
        .item:nth-child(2) .rank { color: #C0C0C0; }
        .item:nth-child(3) .rank { color: #CD7F32; }

        .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        
        .repo-name { font-size: 1.05rem; font-weight: 700; color: var(--accent-blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 英文简介 */
        .desc-en {
            font-size: 0.75rem; color: #999; line-height: 1.4; margin-top: 2px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
            font-style: italic;
        }

        /* 中文简介 */
        .desc-cn {
            font-size: 0.85rem; color: #333; line-height: 1.5; font-weight: 500;
            background: var(--cn-bg); padding: 6px 8px; border-radius: 6px;
            display: block; min-height: 30px;
            border-left: 3px solid #ccc;
            position: relative;
        }
        
        .translating { color: #888; font-style: italic; font-size: 0.75rem; display: flex; align-items: center; gap: 5px;}
        .translating::after { content: '...'; animation: dots 1.5s infinite; }

        @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

        .meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-top: 6px; }
        .stat-badge { font-weight: 600; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.03); padding: 2px 8px; border-radius: 4px; }
        .lang-tag { font-weight: 600; }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-sub); line-height: 2; font-size: 0.9rem; }

        @media (max-width: 1000px) {
            body { height: auto; overflow: auto; }
            .dashboard { grid-template-columns: 1fr; overflow: visible; }
            .column { height: auto; min-height: 500px; margin-bottom: 20px; }
            .header-actions { flex-direction: column; align-items: flex-end; }
            .model-input { width: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>GitHub Top 100 <span style="font-size:1rem; color:#888; font-weight:400;">(AI 双语版)</span></h1>
            <div class="header-desc">Real-time Translation</div>
        </div>
        <div class="header-actions">
            
            <div class="model-input-group">
                <input type="text" id="model-input" class="model-input" 
                       list="model-suggestions" 
                       placeholder="输入 OpenRouter Model ID" 
                       onchange="saveModel()">
                <datalist id="model-suggestions">
                    <option value="google/gemini-2.0-flash-lite-preview-02-05:free">Gemini 2.0 Flash (Free)</option>
                    <option value="deepseek/deepseek-chat">DeepSeek V3</option>
                    <option value="deepseek/deepseek-r1">DeepSeek R1</option>
                    <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                    <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
                </datalist>
            </div>

            <button class="btn btn-key" onclick="setApiKey()">
                🔑 Set API Key
            </button>
            <a href="index.html" class="btn">
                Close
            </a>
        </div>
    </header>

    <div class="dashboard">
        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fire);">Most Stars <small>最多星星 🔥</small></div>
                <span class="col-subtitle">历史累计 Star 数最高的殿堂级项目</span>
            </div>
            <div class="list-container" id="col-stars"><div class="loading">Loading...</div></div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fork);">Most Forks <small>最受欢迎 ⚡️</small></div>
                <span class="col-subtitle">被引用、复制和二创次数最多的项目</span>
            </div>
            <div class="list-container" id="col-forks"><div class="loading">Loading...</div></div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-trend);">Trending <small>飙升最快 🚀</small></div>
                <span class="col-subtitle">最近 30 天内诞生且爆火的新项目</span>
            </div>
            <div class="list-container" id="col-trend"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <script>
        // --- 1. 配置管理 ---
        let apiKey = localStorage.getItem('openrouter_key');
        // 默认模型 ID，可以根据 OpenRouter 的更新随时修改
        let currentModel = localStorage.getItem('openrouter_model') || "google/gemini-2.0-flash-lite-preview-02-05:free";

        // 初始化输入框的值
        document.getElementById('model-input').value = currentModel;

        function setApiKey() {
            const key = prompt("请输入 OpenRouter API Key:\n(仅保存在本地浏览器，格式通常为 sk-or-...)", apiKey || "");
            if (key) {
                localStorage.setItem('openrouter_key', key);
                apiKey = key;
                alert("API Key 已保存！刷新页面以生效。");
                location.reload();
            }
        }

        function saveModel() {
            const val = document.getElementById('model-input').value.trim();
            if (val) {
                localStorage.setItem('openrouter_model', val);
                currentModel = val;
                if(confirm(`模型已切换为: ${val}\n是否刷新页面以应用新模型重新翻译？`)) {
                    location.reload();
                }
            }
        }

        // --- 2. 批量翻译函数 ---
        async function translateBatch(textsArray, targetIds) {
            if (!apiKey) return;
            
            const prompt = `Translate the following GitHub project descriptions into concise Chinese. Return ONLY a JSON array of strings. Do not explain. \n\n${JSON.stringify(textsArray)}`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, 
                        "X-Title": "GitHub Top 100"
                    },
                    body: JSON.stringify({
                        "model": currentModel, // 使用输入框里的自定义模型
                        "messages": [
                            {"role": "system", "content": "You are a professional tech translator. Translate technical descriptions into natural, professional Chinese. Keep it concise."},
                            {"role": "user", "content": prompt}
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || JSON.stringify(data.error));
                }
                
                const content = data.choices[0].message.content;
                const cleanJson = content.replace(/```json|```/g, '').trim();
                const translations = JSON.parse(cleanJson);

                targetIds.forEach((id, index) => {
                    const el = document.getElementById(id);
                    if (el && translations[index]) {
                        el.innerHTML = `<span style="margin-right:4px;">🇨🇳</span>${translations[index]}`;
                        el.style.color = "#333"; 
                        el.style.transition = "opacity 0.5s";
                        el.style.opacity = "0";
                        setTimeout(() => el.style.opacity = "1", 50);
                    }
                });

            } catch (error) {
                console.error("Translation failed:", error);
                targetIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = `<span style="color:red; font-size:0.7rem;">(翻译失败: ${error.message} - 请检查模型ID或Key)</span>`;
                });
            }
        }

        // --- 3. 渲染列表 ---
        function renderList(containerId, items, icon, color) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const textsToTranslate = [];
            const idsToUpdate = [];
            
            items.forEach((repo, index) => {
                const rank = index + 1;
                const starCount = (repo.stargazers_count / 1000).toFixed(1) + 'k';
                const lang = repo.language ? repo.language : 'Code';
                const descEn = repo.description || "No description provided.";
                
                const transId = `${containerId}-trans-${index}`;
                
                textsToTranslate.push(descEn);
                idsToUpdate.push(transId);

                const html = `
                    <a href="${repo.html_url}" target="_blank" class="item">
                        <div class="rank-box">
                            <div class="rank">${rank}</div>
                            <div class="rank-label">Rank</div>
                        </div>
                        <div class="content">
                            <div class="repo-name">${repo.name}</div>
                            
                            <div id="${transId}" class="desc-cn">
                                <span class="translating">AI 翻译中...</span>
                            </div>

                            <div class="desc-en">${descEn}</div>
                            
                            <div class="meta">
                                <span class="stat-badge" style="color:${color}">
                                    ${icon} ${starCount}
                                </span>
                                <span class="lang-tag">${lang}</span>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += html;
            });

            if (apiKey && textsToTranslate.length > 0) {
                translateBatch(textsToTranslate, idsToUpdate);
            } else if (!apiKey) {
                idsToUpdate.forEach(id => {
                    document.getElementById(id).innerHTML = `<span style="color:#999; font-size:0.75rem;">(需设置 API Key 开启翻译)</span>`;
                });
            }
        }

        // --- 4. 获取数据 ---
        async function fetchMostStars() {
            try {
                const res = await fetch('https://api.github.com/search/repositories?q=stars:>1000&sort=stars&per_page=50');
                const data = await res.json();
                renderList('col-stars', data.items, '★', '#FF3B30');
            } catch (e) {
                document.getElementById('col-stars').innerHTML = '<div class="loading">GitHub API Limit Exceeded</div>';
            }
        }

        async function fetchMostForks() {
            try {
                const res = await fetch('https://api.github.com/search/repositories?q=forks:>1000&sort=forks&per_page=50');
                const data = await res.json();
                renderList('col-forks', data.items, '⚡️', '#5856D6');
            } catch (e) { console.error(e); }
        }

        async function fetchTrending() {
            try {
                const date = new Date();
                date.setDate(date.getDate() - 30);
                const dateString = date.toISOString().split('T')[0];
                const res = await fetch(`https://api.github.com/search/repositories?q=created:>${dateString}&sort=stars&per_page=50`);
                const data = await res.json();
                renderList('col-trend', data.items, '🚀', '#34C759');
            } catch (e) { console.error(e); }
        }

        // 启动
        fetchMostStars();
        setTimeout(fetchMostForks, 1000);
        setTimeout(fetchTrending, 2000);

    </script>
</body>
</html>
