<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Top 100 | AI 智能缓存版</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --col-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent-blue: #0071E3;
            --accent-fire: #FF3B30;
            --accent-fork: #5856D6;
            --accent-trend: #34C759;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
            --cn-bg: #F2F2F7;
            --cn-text: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 25px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .header-desc { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
        
        /* 顶部操作区 */
        .header-actions { display: flex; align-items: center; gap: 10px; }

        /* 模型输入框 */
        .model-input-group { position: relative; display: flex; align-items: center; }
        
        .model-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            font-size: 0.8rem;
            width: 240px;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .model-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }

        .btn {
            text-decoration: none; color: var(--text-main); font-weight: 600;
            padding: 8px 16px; background: white; border-radius: 8px;
            border: 1px solid var(--border); cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-size: 0.8rem; transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn:hover { background: #f5f5f5; transform: translateY(-1px); }
        .btn-key { color: var(--accent-blue); }
        .btn-clear { color: #FF3B30; border-color: rgba(255, 59, 48, 0.2); }

        /* --- Dashboard --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
            min-height: 0;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        .column {
            background: var(--col-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .col-header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.98);
            position: sticky; top: 0; z-index: 2;
        }
        
        .col-title { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .col-subtitle { font-size: 0.8rem; color: var(--text-sub); display: block; line-height: 1.4; }

        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 3px; }

        /* --- Item Card --- */
        .item {
            display: flex; gap: 14px; padding: 16px;
            border-bottom: 1px solid var(--border);
            text-decoration: none; color: var(--text-main);
            transition: all 0.2s; border-radius: 10px;
            position: relative;
        }
        .item:hover { background: #F5F7FA; transform: scale(0.995); }

        .rank-box {
            display: flex; flex-direction: column; align-items: center; min-width: 40px; padding-top: 2px;
        }
        .rank { font-size: 1.2rem; font-weight: 900; color: #D1D1D6; line-height: 1; font-variant-numeric: tabular-nums; }
        .rank-label { font-size: 0.65rem; color: #999; margin-top: 4px; text-transform: uppercase; font-weight: 700; }

        .item:nth-child(1) .rank { color: #FFD700; text-shadow: 0 2px 10px rgba(255,215,0,0.4); font-size: 1.5rem; }
        .item:nth-child(2) .rank { color: #C0C0C0; font-size: 1.4rem; }
        .item:nth-child(3) .rank { color: #CD7F32; font-size: 1.4rem; }

        .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        
        .repo-name { font-size: 1.05rem; font-weight: 700; color: var(--accent-blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 英文简介 */
        .desc-en {
            font-size: 0.75rem; color: #999; line-height: 1.4; margin-top: 2px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
            font-style: italic;
        }

        /* 中文简介 */
        .desc-cn {
            font-size: 0.85rem; color: #333; line-height: 1.5; font-weight: 500;
            background: var(--cn-bg); padding: 6px 8px; border-radius: 6px;
            display: block; min-height: 30px;
            border-left: 3px solid #ccc;
            position: relative;
        }
        
        .translating { color: #888; font-style: italic; font-size: 0.75rem; display: flex; align-items: center; gap: 5px;}
        .translating::after { content: '...'; animation: dots 1.5s infinite; }

        @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }

        .meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-top: 6px; }
        .stat-badge { font-weight: 600; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.03); padding: 2px 8px; border-radius: 4px; }
        .lang-tag { font-weight: 600; }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-sub); line-height: 2; font-size: 0.9rem; }

        @media (max-width: 1000px) {
            body { height: auto; overflow: auto; }
            .dashboard { grid-template-columns: 1fr; overflow: visible; }
            .column { height: auto; min-height: 500px; margin-bottom: 20px; }
            .header-actions { flex-direction: column; align-items: flex-end; }
            .model-input { width: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>GitHub Top 100 <span style="font-size:1rem; color:#888; font-weight:400;">(缓存版)</span></h1>
            <div class="header-desc">AI Cached Translation</div>
        </div>
        <div class="header-actions">
            
            <div class="model-input-group">
                <input type="text" id="model-input" class="model-input" 
                       list="model-suggestions" 
                       placeholder="OpenRouter Model ID" 
                       onchange="saveModel()">
                <datalist id="model-suggestions">
                    <option value="google/gemini-2.0-flash-lite-preview-02-05:free">Gemini 2.0 Flash (Free)</option>
                    <option value="deepseek/deepseek-chat">DeepSeek V3</option>
                    <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                </datalist>
            </div>

            <button class="btn btn-key" onclick="setApiKey()">🔑 Set Key</button>
            <button class="btn btn-clear" onclick="clearCache()">🗑️ Clear Cache</button>
            <a href="index.html" class="btn">Close</a>
        </div>
    </header>

    <div class="dashboard">
        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fire);">Most Stars <small>最多星星 🔥</small></div>
                <span class="col-subtitle">历史累计 Star 数最高的 Top 100 项目</span>
            </div>
            <div class="list-container" id="col-stars"><div class="loading">Loading...</div></div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-fork);">Most Forks <small>最受欢迎 ⚡️</small></div>
                <span class="col-subtitle">被引用、复制和二创次数最多的 Top 100</span>
            </div>
            <div class="list-container" id="col-forks"><div class="loading">Loading...</div></div>
        </div>

        <div class="column">
            <div class="col-header">
                <div class="col-title" style="color: var(--accent-trend);">Trending <small>飙升最快 🚀</small></div>
                <span class="col-subtitle">最近 30 天内诞生且爆火的新项目</span>
            </div>
            <div class="list-container" id="col-trend"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <script>
        // --- 1. 配置管理 ---
        let apiKey = localStorage.getItem('openrouter_key');
        let currentModel = localStorage.getItem('openrouter_model') || "google/gemini-2.0-flash-lite-preview-02-05:free";
        document.getElementById('model-input').value = currentModel;

        function setApiKey() {
            const key = prompt("请输入 OpenRouter API Key:", apiKey || "");
            if (key) {
                localStorage.setItem('openrouter_key', key);
                apiKey = key;
                alert("Key 已保存！刷新页面生效。");
                location.reload();
            }
        }

        function saveModel() {
            const val = document.getElementById('model-input').value.trim();
            if (val) {
                localStorage.setItem('openrouter_model', val);
                currentModel = val;
                if(confirm(`模型切换为: ${val}\n是否刷新页面？`)) location.reload();
            }
        }

        function clearCache() {
            if(confirm("确定要清除所有本地翻译缓存吗？下一次加载将重新调用 AI 翻译。")) {
                // 清除所有以 'gh_trans_' 开头的 localStorage
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('gh_trans_')) {
                        localStorage.removeItem(key);
                    }
                });
                alert("缓存已清除。");
                location.reload();
            }
        }

        // --- 2. 缓存管理函数 ---
        // 生成缓存 Key：使用项目全名 (owner/repo) 确保唯一性
        function getCacheKey(repoFullName) {
            return `gh_trans_${repoFullName}`;
        }

        function getCachedTranslation(repoFullName) {
            return localStorage.getItem(getCacheKey(repoFullName));
        }

        function setCachedTranslation(repoFullName, text) {
            localStorage.setItem(getCacheKey(repoFullName), text);
        }

        // --- 3. 批量翻译逻辑 (带缓存检查) ---
        async function translateBatch(itemsToTranslate) {
            if (!apiKey || itemsToTranslate.length === 0) return;

            // 提取纯文本用于发送给 AI
            const texts = itemsToTranslate.map(item => item.text);
            
            const prompt = `Translate the following GitHub project descriptions into concise Chinese. Return ONLY a JSON array of strings in the exact same order. Do not explain. \n\n${JSON.stringify(texts)}`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "GitHub Top 100"
                    },
                    body: JSON.stringify({
                        "model": currentModel,
                        "messages": [
                            {"role": "system", "content": "You are a professional tech translator. Translate technical descriptions into natural, professional Chinese. Keep it concise."},
                            {"role": "user", "content": prompt}
                        ]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const content = data.choices[0].message.content;
                const cleanJson = content.replace(/```json|```/g, '').trim();
                const translations = JSON.parse(cleanJson);

                // 处理翻译结果
                translations.forEach((transText, i) => {
                    const item = itemsToTranslate[i];
                    // 1. 更新 DOM
                    const el = document.getElementById(item.domId);
                    if (el) {
                        el.innerHTML = `<span style="margin-right:4px;">🇨🇳</span>${transText}`;
                        el.style.color = "#333";
                        el.style.opacity = "0";
                        el.style.transition = "opacity 0.5s";
                        setTimeout(() => el.style.opacity = "1", 50);
                    }
                    // 2. 存入本地缓存
                    setCachedTranslation(item.repoFullName, transText);
                });

            } catch (error) {
                console.error("Translation Error:", error);
                itemsToTranslate.forEach(item => {
                    const el = document.getElementById(item.domId);
                    if (el) el.innerHTML = `<span style="color:red; font-size:0.7rem;">(翻译失败)</span>`;
                });
            }
        }

        // --- 4. 渲染列表 (智能分离缓存与新内容) ---
        function renderList(containerId, items, icon, color) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const needTranslationQueue = []; // 需要调用 API 的队列
            
            items.forEach((repo, index) => {
                const rank = index + 1;
                const starCount = (repo.stargazers_count / 1000).toFixed(1) + 'k';
                const lang = repo.language ? repo.language : 'Code';
                const descEn = repo.description || "No description provided.";
                
                const domId = `${containerId}-trans-${index}`;
                const cacheKey = repo.full_name; // 使用 full_name (e.g., vuejs/vue) 防止重名
                
                // --- 检查缓存 ---
                const cachedText = getCachedTranslation(cacheKey);
                let descCnHtml = '';

                if (cachedText) {
                    // 命中缓存：直接显示中文
                    descCnHtml = `<span style="margin-right:4px;">🇨🇳</span>${cachedText}`;
                } else {
                    // 未命中缓存：显示 Loading，并加入待翻译队列
                    descCnHtml = `<span class="translating">AI 翻译中...</span>`;
                    needTranslationQueue.push({
                        domId: domId,
                        text: descEn,
                        repoFullName: cacheKey
                    });
                }

                const html = `
                    <a href="${repo.html_url}" target="_blank" class="item">
                        <div class="rank-box">
                            <div class="rank">${rank}</div>
                            <div class="rank-label">Rank</div>
                        </div>
                        <div class="content">
                            <div class="repo-name">${repo.name}</div>
                            
                            <div id="${domId}" class="desc-cn" style="${cachedText ? 'color:#333' : ''}">
                                ${descCnHtml}
                            </div>

                            <div class="desc-en">${descEn}</div>
                            
                            <div class="meta">
                                <span class="stat-badge" style="color:${color}">
                                    ${icon} ${starCount}
                                </span>
                                <span class="lang-tag">${lang}</span>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += html;
            });

            // 如果有需要翻译的新内容，且有 Key，则批量发送请求
            if (apiKey && needTranslationQueue.length > 0) {
                // 分批处理，防止一次请求过大（每批 20 个）
                const batchSize = 20;
                for (let i = 0; i < needTranslationQueue.length; i += batchSize) {
                    const batch = needTranslationQueue.slice(i, i + batchSize);
                    translateBatch(batch);
                }
            } else if (!apiKey && needTranslationQueue.length > 0) {
                needTranslationQueue.forEach(item => {
                    document.getElementById(item.domId).innerHTML = 
                        `<span style="color:#999; font-size:0.75rem;">(需设置 Key 开启翻译)</span>`;
                });
            }
        }

        // --- 5. 获取数据 (设置为100条) ---
        async function fetchMostStars() {
            try {
                // per_page=100
                const res = await fetch('https://api.github.com/search/repositories?q=stars:>1000&sort=stars&per_page=100');
                const data = await res.json();
                renderList('col-stars', data.items, '★', '#FF3B30');
            } catch (e) {
                document.getElementById('col-stars').innerHTML = '<div class="loading">GitHub API Limit Exceeded</div>';
            }
        }

        async function fetchMostForks() {
            try {
                const res = await fetch('https://api.github.com/search/repositories?q=forks:>1000&sort=forks&per_page=100');
                const data = await res.json();
                renderList('col-forks', data.items, '⚡️', '#5856D6');
            } catch (e) { console.error(e); }
        }

        async function fetchTrending() {
            try {
                const date = new Date();
                date.setDate(date.getDate() - 30);
                const dateString = date.toISOString().split('T')[0];
                const res = await fetch(`https://api.github.com/search/repositories?q=created:>${dateString}&sort=stars&per_page=100`);
                const data = await res.json();
                renderList('col-trend', data.items, '🚀', '#34C759');
            } catch (e) { console.error(e); }
        }

        // 启动 (错峰加载)
        fetchMostStars();
        setTimeout(fetchMostForks, 1500);
        setTimeout(fetchTrending, 3000);

    </script>
</body>
</html>
