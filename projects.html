<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source | Carl Louis</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent-blue: #0071E3;
            --gold: #FFD700;   /* 金牌 */
            --silver: #C0C0C0; /* 银牌 */
            --bronze: #CD7F32; /* 铜牌 */
            --radius: 20px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* --- 顶部 Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .header-left h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; }
        .header-left p { color: var(--text-sub); margin-top: 5px; }

        .back-btn {
            text-decoration: none; color: var(--text-main); background: white;
            padding: 8px 16px; border-radius: 100px; font-weight: 600;
            box-shadow: var(--shadow); transition: 0.2s;
        }
        .back-btn:hover { transform: scale(1.02); }

        /* --- 排行榜列表 --- */
        .repo-list { display: flex; flex-direction: column; gap: 16px; }

        .repo-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .repo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

        /* 排名数字 */
        .rank {
            font-size: 1.5rem; font-weight: 800; color: #E0E0E0;
            width: 40px; text-align: center; flex-shrink: 0;
        }
        /* 前三名高亮 */
        .repo-card[data-rank="1"] .rank { color: var(--gold); text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4); font-size: 2rem; }
        .repo-card[data-rank="2"] .rank { color: var(--silver); font-size: 1.8rem; }
        .repo-card[data-rank="3"] .rank { color: var(--bronze); font-size: 1.8rem; }

        /* 内容区 */
        .content { flex-grow: 1; min-width: 0; }
        .repo-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .repo-desc { font-size: 0.9rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* 底部信息栏 */
        .meta { display: flex; align-items: center; gap: 15px; margin-top: 10px; font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }
        
        .star-box {
            display: flex; align-items: center; gap: 4px;
            color: var(--text-main); background: #F5F5F7;
            padding: 4px 10px; border-radius: 6px;
        }
        .star-icon { color: #F39C12; }

        .lang-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ccc; }

        /* 加载动画 */
        .loading { text-align: center; margin-top: 50px; color: var(--text-sub); }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>Top Projects</h1>
                <p>Most starred repositories on GitHub.</p>
            </div>
            <a href="index.html" class="back-btn">Close</a>
        </header>

        <div id="repo-list" class="repo-list">
            <div class="loading">Loading data from GitHub API...</div>
        </div>
    </div>

    <script>
        // 配置：你的 GitHub 用户名
        const USERNAME = 'carl0311'; 

        // 编程语言颜色映射
        const langColors = {
            'HTML': '#e34c26',
            'CSS': '#563d7c',
            'JavaScript': '#f1e05a',
            'Python': '#3572A5',
            'Vue': '#41b883',
            'TypeScript': '#2b7489'
        };

        async function fetchRepos() {
            try {
                // 调用 GitHub API
                const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100`);
                const data = await response.json();

                if (!Array.isArray(data)) {
                    document.getElementById('repo-list').innerHTML = '<div class="loading">API Rate Limit Exceeded. Please try again later.</div>';
                    return;
                }

                // 1. 过滤：只显示非 Fork 的仓库（如果你想显示 Fork 的，把这行注释掉）
                const myRepos = data.filter(repo => !repo.fork);

                // 2. 排序：按 Star 数量倒序
                myRepos.sort((a, b) => b.stargazers_count - a.stargazers_count);

                // 3. 截取：只显示前 10 名
                const topRepos = myRepos.slice(0, 10);

                const container = document.getElementById('repo-list');
                container.innerHTML = ''; // 清空加载文字

                topRepos.forEach((repo, index) => {
                    const rank = index + 1;
                    const langColor = langColors[repo.language] || '#858585';
                    const desc = repo.description || "No description provided.";
                    
                    const card = `
                        <a href="${repo.html_url}" target="_blank" class="repo-card" data-rank="${rank}">
                            <div class="rank">#${rank}</div>
                            <div class="content">
                                <div class="repo-name">${repo.name}</div>
                                <div class="repo-desc">${desc}</div>
                                <div class="meta">
                                    <div class="star-box">
                                        <span class="star-icon">★</span> ${repo.stargazers_count}
                                    </div>
                                    <div style="display:flex; align-items:center; gap:5px;">
                                        <span class="lang-dot" style="background:${langColor}"></span>
                                        ${repo.language || 'Unknown'}
                                    </div>
                                    <div>Updated: ${new Date(repo.updated_at).toLocaleDateString()}</div>
                                </div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error(error);
                document.getElementById('repo-list').innerHTML = '<div class="loading">Failed to load data.</div>';
            }
        }

        fetchRepos();
    </script>

</body>
</html>
