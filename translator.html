<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能翻译</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Google Sans",Roboto,sans-serif;background:#fff;color:#202124}
.app{display:flex;flex-direction:column;height:100vh}
.header{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;color:#4285f4}
.logo i{font-size:28px;color:#4285f4}
.btn-settings{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:14px;color:#5f6368;transition:all .15s}
.btn-settings:hover{background:#f1f3f4;color:#4285f4;border-color:#4285f4}
.lang-bar{background:#f8f9fa;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 20px;height:52px;flex-shrink:0;position:relative}
.lang-tabs,.target-tabs{display:flex;gap:2px;flex:1;overflow:hidden}
.lang-tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:500;color:#5f6368;border:none;background:transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.lang-tab:hover{background:#e8eaed;color:#202124}
.lang-tab.active{background:#fff;color:#4285f4;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swap-btn{width:40px;height:40px;border-radius:50%;border:1px solid #dadce0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4285f4;margin:0 12px;flex-shrink:0;transition:all .15s}
.swap-btn:hover{background:#e8f0fe}
.swap-btn i{font-size:20px}
.panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
.panel-src{border-right:1px solid #e0e0e0}
.panel textarea{flex:1;width:100%;border:none;outline:none;resize:none;font-size:24px;padding:24px 48px 0 24px;background:transparent;color:#202124;line-height:1.5;font-family:inherit}
.panel textarea::placeholder{color:#bdc1c6}
.panel-out-text{flex:1;padding:24px;font-size:24px;color:#1a73e8;line-height:1.5;overflow-y:auto;word-break:break-word}
.panel-out-text.empty{color:#bdc1c6}
.panel-footer{padding:8px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px}
.char-count{font-size:12px;color:#9aa0a6}
.debounce-ind{font-size:12px;color:#4285f4;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clear-btn{position:absolute;top:16px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:#9aa0a6;display:flex;align-items:center;justify-content:center;transition:all .15s}
.clear-btn:hover{background:#f1f3f4;color:#444}
.clear-btn i{font-size:18px}
.loading-dots{display:flex;gap:6px;padding:24px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#4285f4;animation:bounce .8s infinite;opacity:.6}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.copy-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:13px;color:#5f6368;transition:all .15s}
.copy-btn:hover{background:#f1f3f4;color:#4285f4}
.copy-btn.copied{color:#34a853;border-color:#34a853}
.lang-dropdown{position:absolute;background:#fff;border:1px solid #dadce0;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.15);min-width:200px;z-index:100;max-height:320px;display:flex;flex-direction:column;overflow:hidden;top:52px}
.dropdown-search{padding:8px;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.dropdown-search input{width:100%;padding:7px 10px;border:1px solid #dadce0;border-radius:4px;font-size:14px;outline:none;color:#202124}
.dropdown-search input:focus{border-color:#4285f4}
.dropdown-list{overflow-y:auto;flex:1}
.dropdown-item{padding:10px 16px;cursor:pointer;font-size:14px;color:#202124;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.dropdown-item:hover{background:#f1f3f4}
.dropdown-item.selected{color:#4285f4;font-weight:500}
.dropdown-item.auto-item{border-bottom:1px solid #e0e0e0;color:#5f6368}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:18px;font-weight:500;color:#202124}
.modal-close{width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5f6368;transition:background .15s}
.modal-close:hover{background:#f1f3f4}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:13px;font-weight:500;color:#5f6368;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1px solid #dadce0;border-radius:4px;font-size:14px;font-family:monospace;outline:none;color:#202124;transition:border .15s}
.field input:focus{border-color:#4285f4;box-shadow:0 0 0 2px rgba(66,133,244,.15)}
.modal-footer{padding:16px 24px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{padding:9px 20px;border-radius:4px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:14px;font-weight:500;color:#202124;transition:background .15s}
.btn-cancel:hover{background:#f1f3f4}
.btn-save{padding:9px 24px;border-radius:4px;border:none;background:#4285f4;color:#fff;cursor:pointer;font-size:14px;font-weight:500;transition:background .15s}
.btn-save:hover{background:#1a73e8}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 24px;border-radius:4px;font-size:14px;z-index:2000;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="app" class="app">

  <div class="header">
    <div class="logo">
      <i class="ti ti-world" aria-hidden="true"></i>
      AI 翻译
    </div>
    <button class="btn-settings" id="openSettings">
      <i class="ti ti-settings" aria-hidden="true"></i>
      配置 API
    </button>
  </div>

  <div class="lang-bar" id="langBar">
    <div class="lang-tabs" id="srcTabs"></div>
    <button class="swap-btn" id="swapBtn" title="互换语言">
      <i class="ti ti-switch-horizontal" aria-hidden="true"></i>
    </button>
    <div class="target-tabs" id="tgtTabs"></div>
  </div>

  <div class="panels">
    <div class="panel panel-src">
      <textarea id="srcText" placeholder="输入文字" maxlength="5000"></textarea>
      <button class="clear-btn" id="clearBtn" style="display:none" title="清除">
        <i class="ti ti-x"></i>
      </button>
      <div class="panel-footer">
        <span class="char-count" id="charCount">0 / 5000</span>
        <span class="debounce-ind" id="debounceInd" style="display:none">翻译中…</span>
      </div>
    </div>

    <div class="panel">
      <div id="loadingDots" class="loading-dots" style="display:none">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="panel-out-text empty" id="outText">翻译</div>
      <div class="panel-footer">
        <div></div>
        <button class="copy-btn" id="copyBtn" style="display:none">
          <i class="ti ti-copy" id="copyIcon"></i>
          <span id="copyLabel">复制翻译</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- 语言下拉 -->
<div id="dropdown" class="lang-dropdown" style="display:none">
  <div class="dropdown-search">
    <input type="text" placeholder="搜索语言" id="ddSearch">
  </div>
  <div class="dropdown-list" id="ddList"></div>
</div>

<!-- 配置弹窗 -->
<div class="modal-bg" id="modalBg" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>API 配置</h2>
      <button class="modal-close" id="closeModal"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>API 地址 (Base URL)</label>
        <input id="cfgUrl" type="text" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label>API 密钥 (Key)</label>
        <input id="cfgKey" type="password" placeholder="sk-...">
      </div>
      <div class="field">
        <label>模型名称 (Model)</label>
        <input id="cfgModel" type="text" placeholder="gpt-4o-mini">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="cancelModal">取消</button>
      <button class="btn-save" id="saveModal">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LANGS = ['简体中文','繁体中文','英语','日语','韩语','法语','西班牙语','德语','俄语','葡萄牙语','意大利语','荷兰语','波兰语','土耳其语','阿拉伯语','泰语','越南语','印尼语','希腊语','捷克语','瑞典语','丹麦语','芬兰语','挪威语','匈牙利语','罗马尼亚语','乌克兰语','希伯来语','马来语','波斯语','印地语','孟加拉语','菲律宾语'];
const RECENT_SRC = ['自动检测','简体中文','英语','日语'];
const RECENT_TGT = ['英语','简体中文','日语','韩语'];

let state = {
  srcLang: '自动检测',
  tgtLang: '英语',
  srcText: '',
  outText: '',
  isLoading: false,
  dropdownFor: null,
  config: {
    baseUrl: localStorage.getItem('gt_url') || 'https://api.openai.com/v1',
    apiKey: localStorage.getItem('gt_key') || '',
    model: localStorage.getItem('gt_model') || 'gpt-4o-mini'
  }
};

let debTimer = null;

function renderTabs() {
  const srcTabs = document.getElementById('srcTabs');
  const tgtTabs = document.getElementById('tgtTabs');
  srcTabs.innerHTML = '';
  tgtTabs.innerHTML = '';

  RECENT_SRC.forEach(l => {
    const b = document.createElement('button');
    b.className = 'lang-tab' + (state.srcLang === l ? ' active' : '');
    b.textContent = l;
    b.onclick = () => { state.srcLang = l; renderTabs(); if (state.srcText) doTranslate(); };
    srcTabs.appendChild(b);
  });
  const moreS = document.createElement('button');
  moreS.className = 'lang-tab';
  moreS.innerHTML = '<i class="ti ti-chevron-down" style="font-size:16px"></i>';
  moreS.onclick = (e) => openDropdown('src', e.currentTarget);
  srcTabs.appendChild(moreS);

  RECENT_TGT.forEach(l => {
    const b = document.createElement('button');
    b.className = 'lang-tab' + (state.tgtLang === l ? ' active' : '');
    b.textContent = l;
    b.onclick = () => { state.tgtLang = l; renderTabs(); if (state.srcText) doTranslate(); };
    tgtTabs.appendChild(b);
  });
  const moreT = document.createElement('button');
  moreT.className = 'lang-tab';
  moreT.innerHTML = '<i class="ti ti-chevron-down" style="font-size:16px"></i>';
  moreT.onclick = (e) => openDropdown('tgt', e.currentTarget);
  tgtTabs.appendChild(moreT);
}

function openDropdown(side, anchor) {
  state.dropdownFor = side;
  const dd = document.getElementById('dropdown');
  const search = document.getElementById('ddSearch');
  search.value = '';
  renderDropdownList('');
  const rect = anchor.getBoundingClientRect();
  dd.style.top = rect.bottom + 'px';
  if (side === 'src') { dd.style.left = '20px'; dd.style.right = 'auto'; }
  else { dd.style.right = '20px'; dd.style.left = 'auto'; }
  dd.style.display = 'flex';
  setTimeout(() => search.focus(), 50);
}

function renderDropdownList(q) {
  const list = document.getElementById('ddList');
  list.innerHTML = '';
  const side = state.dropdownFor;
  const current = side === 'src' ? state.srcLang : state.tgtLang;
  const filtered = q ? LANGS.filter(l => l.includes(q)) : LANGS;

  if (side === 'src' && !q) {
    const a = document.createElement('div');
    a.className = 'dropdown-item auto-item' + (current === '自动检测' ? ' selected' : '');
    a.textContent = '✨ 自动检测';
    if (current === '自动检测') {
      const ck = document.createElement('i');
      ck.className = 'ti ti-check';
      ck.style.fontSize = '14px';
      a.appendChild(ck);
    }
    a.onclick = () => { state.srcLang = '自动检测'; closeDropdown(); renderTabs(); if (state.srcText) doTranslate(); };
    list.appendChild(a);
  }

  filtered.forEach(l => {
    const d = document.createElement('div');
    d.className = 'dropdown-item' + (current === l ? ' selected' : '');
    d.textContent = l;
    if (current === l) {
      const ck = document.createElement('i');
      ck.className = 'ti ti-check';
      ck.style.fontSize = '14px';
      d.appendChild(ck);
    }
    d.onclick = () => {
      if (side === 'src') state.srcLang = l; else state.tgtLang = l;
      closeDropdown(); renderTabs(); if (state.srcText) doTranslate();
    };
    list.appendChild(d);
  });
}

function closeDropdown() {
  document.getElementById('dropdown').style.display = 'none';
  state.dropdownFor = null;
}

document.getElementById('ddSearch').addEventListener('input', e => renderDropdownList(e.target.value));
document.addEventListener('click', e => {
  const dd = document.getElementById('dropdown');
  if (dd.style.display !== 'none' && !dd.contains(e.target)) closeDropdown();
});

document.getElementById('swapBtn').addEventListener('click', () => {
  if (state.srcLang === '自动检测') { showToast('"自动检测"模式下无法互换，请先选择源语言'); return; }
  const tmp = state.srcLang; state.srcLang = state.tgtLang; state.tgtLang = tmp;
  if (state.outText) {
    document.getElementById('srcText').value = state.outText;
    state.srcText = state.outText;
    state.outText = '';
    updateOut('');
    doTranslate();
  }
  renderTabs();
});

const srcTA = document.getElementById('srcText');
srcTA.addEventListener('input', () => {
  const v = srcTA.value;
  state.srcText = v;
  document.getElementById('charCount').textContent = v.length + ' / 5000';
  document.getElementById('clearBtn').style.display = v ? 'flex' : 'none';
  if (debTimer) clearTimeout(debTimer);
  if (!v.trim()) {
    updateOut('');
    document.getElementById('debounceInd').style.display = 'none';
    return;
  }
  document.getElementById('debounceInd').style.display = 'inline';
  debTimer = setTimeout(() => {
    document.getElementById('debounceInd').style.display = 'none';
    doTranslate();
  }, 800);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  srcTA.value = '';
  state.srcText = '';
  state.outText = '';
  document.getElementById('charCount').textContent = '0 / 5000';
  document.getElementById('clearBtn').style.display = 'none';
  updateOut('');
});

function updateOut(text) {
  const el = document.getElementById('outText');
  const copyBtn = document.getElementById('copyBtn');
  if (!text) {
    el.className = 'panel-out-text empty';
    el.textContent = '翻译';
    copyBtn.style.display = 'none';
  } else {
    el.className = 'panel-out-text';
    el.textContent = text;
    copyBtn.style.display = 'flex';
  }
}

async function doTranslate() {
  if (!state.srcText.trim()) return;
  if (!state.config.apiKey) { showToast('请先点击"配置 API"填写 API Key'); return; }

  state.isLoading = true;
  document.getElementById('loadingDots').style.display = 'flex';
  document.getElementById('outText').style.display = 'none';
  state.outText = '';

  const prompt = `你是专业翻译引擎。将以下文本从【${state.srcLang}】翻译成【${state.tgtLang}】。仅输出翻译结果，不含任何解释或额外内容。保持原文语气和格式。\n\n${state.srcText}`;

  try {
    const base = state.config.baseUrl.replace(/\/+$/, '');
    const res = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.config.apiKey },
      body: JSON.stringify({ model: state.config.model, messages: [{ role: 'user', content: prompt }], stream: true, temperature: 0.3 })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = '';

    document.getElementById('loadingDots').style.display = 'none';
    document.getElementById('outText').style.display = 'block';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ') || line.includes('[DONE]')) continue;
        try {
          const d = JSON.parse(line.slice(6));
          acc += d.choices[0]?.delta?.content || '';
        } catch (e) {}
      }
      state.outText = acc;
      updateOut(acc);
    }
  } catch (e) {
    document.getElementById('loadingDots').style.display = 'none';
    document.getElementById('outText').style.display = 'block';
    updateOut('翻译失败：' + e.message);
  } finally {
    state.isLoading = false;
    document.getElementById('loadingDots').style.display = 'none';
    document.getElementById('outText').style.display = 'block';
  }
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(state.outText);
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    document.getElementById('copyIcon').className = 'ti ti-check';
    document.getElementById('copyLabel').textContent = '已复制';
    setTimeout(() => {
      btn.classList.remove('copied');
      document.getElementById('copyIcon').className = 'ti ti-copy';
      document.getElementById('copyLabel').textContent = '复制翻译';
    }, 2000);
  } catch (e) { showToast('复制失败'); }
});

document.getElementById('openSettings').addEventListener('click', () => {
  document.getElementById('cfgUrl').value = state.config.baseUrl;
  document.getElementById('cfgKey').value = state.config.apiKey;
  document.getElementById('cfgModel').value = state.config.model;
  document.getElementById('modalBg').style.display = 'flex';
});
document.getElementById('closeModal').addEventListener('click', () => document.getElementById('modalBg').style.display = 'none');
document.getElementById('cancelModal').addEventListener('click', () => document.getElementById('modalBg').style.display = 'none');
document.getElementById('saveModal').addEventListener('click', () => {
  state.config.baseUrl = document.getElementById('cfgUrl').value.trim() || 'https://api.openai.com/v1';
  state.config.apiKey = document.getElementById('cfgKey').value.trim();
  state.config.model = document.getElementById('cfgModel').value.trim() || 'gpt-4o-mini';
  localStorage.setItem('gt_url', state.config.baseUrl);
  localStorage.setItem('gt_key', state.config.apiKey);
  localStorage.setItem('gt_model', state.config.model);
  document.getElementById('modalBg').style.display = 'none';
  showToast('设置已保存');
  if (state.srcText) doTranslate();
});
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg')) document.getElementById('modalBg').style.display = 'none';
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderTabs();
</script>
</body>
</html>
