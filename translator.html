
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{display:flex;flex-direction:column;height:600px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Google Sans",Roboto,sans-serif;color:#202124;position:relative}
.header{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:500;color:#4285f4}
.logo i{font-size:24px}
.btn-cfg{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:13px;color:#5f6368;transition:all .15s;font-family:inherit}
.btn-cfg:hover{background:#f1f3f4;color:#4285f4;border-color:#4285f4}
.lang-bar{background:#f8f9fa;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 16px;height:50px;flex-shrink:0;position:relative;z-index:10}
.lang-side{display:flex;gap:2px;flex:1;align-items:center;min-width:0}
.ltab{padding:7px 14px;border-radius:18px;cursor:pointer;font-size:13px;font-weight:500;color:#5f6368;border:none;background:transparent;transition:all .15s;white-space:nowrap;font-family:inherit;flex-shrink:0}
.ltab:hover{background:#e8eaed;color:#202124}
.ltab.active{background:#fff;color:#4285f4;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.more-btn{width:32px;height:32px;border-radius:50%;border:1px solid #dadce0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5f6368;transition:all .15s;flex-shrink:0;margin-left:2px}
.more-btn:hover{background:#e8f0fe;color:#4285f4;border-color:#4285f4}
.more-btn i{font-size:16px;line-height:1;display:block}
.swap-btn{width:38px;height:38px;border-radius:50%;border:1px solid #dadce0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4285f4;margin:0 10px;flex-shrink:0;transition:all .15s}
.swap-btn:hover{background:#e8f0fe}
.swap-btn i{font-size:18px;line-height:1;display:block}
.panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panel-l{border-right:1px solid #e0e0e0;position:relative}
.panel textarea{flex:1;width:100%;border:none;outline:none;resize:none;font-size:22px;padding:20px 44px 0 20px;background:transparent;color:#202124;line-height:1.5;font-family:inherit}
.panel textarea::placeholder{color:#bdc1c6}
.out-text{flex:1;padding:20px;font-size:22px;color:#1a73e8;line-height:1.5;overflow-y:auto;word-break:break-word}
.out-text.ph{color:#bdc1c6}
.pfoot{padding:6px 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:40px}
.char-ct{font-size:11px;color:#9aa0a6}
.dind{font-size:11px;color:#4285f4;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clr-btn{position:absolute;top:14px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:#9aa0a6;display:flex;align-items:center;justify-content:center;transition:all .15s}
.clr-btn:hover{background:#f1f3f4;color:#444}
.clr-btn i{font-size:17px;line-height:1;display:block}
.ldots{display:flex;gap:5px;padding:20px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#4285f4;animation:bonce .8s infinite;opacity:.6}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bonce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.copy-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:18px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:12px;color:#5f6368;transition:all .15s;font-family:inherit}
.copy-btn:hover{background:#f1f3f4;color:#4285f4}
.copy-btn.ok{color:#34a853;border-color:#34a853}
.dd-wrap{position:absolute;background:#fff;border:1px solid #dadce0;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.18);width:220px;z-index:500;max-height:300px;display:none;flex-direction:column;overflow:hidden}
.dd-search{padding:8px;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.dd-search input{width:100%;padding:6px 10px;border:1px solid #dadce0;border-radius:4px;font-size:13px;outline:none;color:#202124;font-family:inherit}
.dd-search input:focus{border-color:#4285f4}
.dd-list{overflow-y:auto;flex:1}
.dd-item{padding:9px 16px;cursor:pointer;font-size:13px;color:#202124;display:flex;align-items:center;justify-content:space-between}
.dd-item:hover{background:#f1f3f4}
.dd-item.sel{color:#4285f4;font-weight:500}
.dd-item.auto-sep{border-bottom:1px solid #e0e0e0;color:#5f6368}
.modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:440px}
.mhead{padding:18px 20px 14px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.mhead h3{font-size:16px;font-weight:500;color:#202124}
.mcls{width:32px;height:32px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5f6368}
.mcls:hover{background:#f1f3f4}
.mcls i{font-size:18px;line-height:1;display:block}
.mbody{padding:20px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;font-weight:500;color:#5f6368;margin-bottom:5px}
.field input{width:100%;padding:9px 12px;border:1px solid #dadce0;border-radius:4px;font-size:13px;font-family:monospace;outline:none;color:#202124}
.field input:focus{border-color:#4285f4;box-shadow:0 0 0 2px rgba(66,133,244,.15)}
.mfoot{padding:14px 20px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{padding:8px 18px;border-radius:4px;border:1px solid #dadce0;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:#202124;font-family:inherit}
.btn-cancel:hover{background:#f1f3f4}
.btn-save{padding:8px 22px;border-radius:4px;border:none;background:#4285f4;color:#fff;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn-save:hover{background:#1a73e8}
.toast-msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 20px;border-radius:4px;font-size:13px;z-index:700;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.toast-msg.on{opacity:1}
</style>

<div class="app" id="app">
  <div class="header">
    <div class="logo"><i class="ti ti-world" aria-hidden="true"></i> AI 翻译</div>
    <button class="btn-cfg" id="openCfg"><i class="ti ti-settings" aria-hidden="true"></i> 配置 API</button>
  </div>

  <div class="lang-bar">
    <div class="lang-side" id="srcSide"></div>
    <button class="swap-btn" id="swapBtn" title="互换语言"><i class="ti ti-switch-horizontal" aria-hidden="true"></i></button>
    <div class="lang-side" id="tgtSide"></div>
  </div>

  <div class="panels">
    <div class="panel panel-l">
      <textarea id="srcTA" placeholder="输入文字" maxlength="5000"></textarea>
      <button class="clr-btn" id="clrBtn" style="display:none"><i class="ti ti-x"></i></button>
      <div class="pfoot">
        <span class="char-ct" id="charCt">0 / 5000</span>
        <span class="dind" id="dind" style="display:none">翻译中…</span>
      </div>
    </div>
    <div class="panel">
      <div class="ldots" id="ldots" style="display:none"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="out-text ph" id="outEl">翻译</div>
      <div class="pfoot">
        <div></div>
        <button class="copy-btn" id="copyBtn" style="display:none">
          <i class="ti ti-copy" id="copyIco"></i><span id="copyLbl">复制翻译</span>
        </button>
      </div>
    </div>
  </div>

  <div class="dd-wrap" id="ddWrap">
    <div class="dd-search"><input type="text" id="ddQ" placeholder="搜索语言…" autocomplete="off"></div>
    <div class="dd-list" id="ddList"></div>
  </div>

  <div class="modal-wrap" id="modalWrap">
    <div class="modal">
      <div class="mhead"><h3>API 配置</h3><button class="mcls" id="mCls"><i class="ti ti-x"></i></button></div>
      <div class="mbody">
        <div class="field"><label>API 地址 (Base URL)</label><input id="cfgUrl" type="text" placeholder="https://api.openai.com/v1"></div>
        <div class="field"><label>API 密钥 (Key)</label><input id="cfgKey" type="password" placeholder="sk-..."></div>
        <div class="field"><label>模型名称 (Model)</label><input id="cfgMdl" type="text" placeholder="gpt-4o-mini"></div>
      </div>
      <div class="mfoot">
        <button class="btn-cancel" id="mCancel">取消</button>
        <button class="btn-save" id="mSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast-msg" id="toast"></div>
</div>

<script>
const LANGS=['简体中文','繁体中文','英语','日语','韩语','法语','西班牙语','德语','俄语','葡萄牙语','意大利语','荷兰语','波兰语','土耳其语','阿拉伯语','泰语','越南语','印尼语','希腊语','捷克语','瑞典语','丹麦语','芬兰语','挪威语','匈牙利语','罗马尼亚语','乌克兰语','希伯来语','马来语','波斯语','印地语','孟加拉语','菲律宾语'];
const SQ=['自动检测','简体中文','英语','日语'];
const TQ=['英语','简体中文','日语','韩语'];

const S={
  src:'自动检测', tgt:'英语', out:'', ddFor:null,
  cfg:{
    url:localStorage.getItem('gt_url')||'https://api.openai.com/v1',
    key:localStorage.getItem('gt_key')||'',
    mdl:localStorage.getItem('gt_mdl')||'gpt-4o-mini'
  }
};
let debT=null;

function buildTabs(){
  ['srcSide','tgtSide'].forEach((id,si)=>{
    const el=document.getElementById(id);
    el.innerHTML='';
    const quick=si===0?SQ:TQ;
    const cur=si===0?S.src:S.tgt;
    quick.forEach(l=>{
      const b=document.createElement('button');
      b.className='ltab'+(cur===l?' active':'');
      b.textContent=l;
      b.onclick=()=>{
        if(si===0)S.src=l; else S.tgt=l;
        buildTabs();
        if(document.getElementById('srcTA').value.trim())go();
      };
      el.appendChild(b);
    });
    const more=document.createElement('button');
    more.className='more-btn';
    more.title=si===0?'更多源语言':'更多目标语言';
    more.innerHTML='<i class="ti ti-chevron-down" aria-hidden="true"></i>';
    more.addEventListener('click',function(e){
      e.stopPropagation();
      openDD(si===0?'src':'tgt', this);
    });
    el.appendChild(more);
  });
}

function openDD(side, anchor){
  S.ddFor=side;
  const dd=document.getElementById('ddWrap');
  const app=document.getElementById('app');
  const ar=anchor.getBoundingClientRect();
  const pr=app.getBoundingClientRect();
  dd.style.top=(ar.bottom-pr.top+2)+'px';
  if(side==='src'){dd.style.left='10px';dd.style.right='auto';}
  else{dd.style.right='10px';dd.style.left='auto';}
  document.getElementById('ddQ').value='';
  fillDD('');
  dd.style.display='flex';
  setTimeout(()=>document.getElementById('ddQ').focus(),40);
}

function fillDD(q){
  const list=document.getElementById('ddList');
  list.innerHTML='';
  const cur=S.ddFor==='src'?S.src:S.tgt;
  const items=q?LANGS.filter(l=>l.includes(q)):LANGS;
  if(S.ddFor==='src'&&!q){
    const a=document.createElement('div');
    a.className='dd-item auto-sep'+(cur==='自动检测'?' sel':'');
    const span=document.createElement('span');
    span.textContent='✨ 自动检测';
    a.appendChild(span);
    if(cur==='自动检测'){const ck=document.createElement('i');ck.className='ti ti-check';ck.style.cssText='font-size:13px;color:#4285f4';a.appendChild(ck);}
    a.onclick=()=>{S.src='自动检测';closeDD();buildTabs();if(document.getElementById('srcTA').value.trim())go();};
    list.appendChild(a);
  }
  items.forEach(l=>{
    const d=document.createElement('div');
    d.className='dd-item'+(cur===l?' sel':'');
    const span=document.createElement('span');
    span.textContent=l;
    d.appendChild(span);
    if(cur===l){const ck=document.createElement('i');ck.className='ti ti-check';ck.style.cssText='font-size:13px;color:#4285f4';d.appendChild(ck);}
    d.onclick=()=>{
      if(S.ddFor==='src')S.src=l; else S.tgt=l;
      closeDD();buildTabs();if(document.getElementById('srcTA').value.trim())go();
    };
    list.appendChild(d);
  });
}

function closeDD(){document.getElementById('ddWrap').style.display='none';S.ddFor=null;}

document.getElementById('ddQ').addEventListener('input',e=>fillDD(e.target.value));

document.addEventListener('click',function(e){
  const dd=document.getElementById('ddWrap');
  if(dd.style.display==='flex'&&!dd.contains(e.target))closeDD();
});

document.getElementById('swapBtn').addEventListener('click',()=>{
  if(S.src==='自动检测'){toast('"自动检测"下无法互换，请先选择源语言');return;}
  const t=S.src;S.src=S.tgt;S.tgt=t;
  if(S.out){
    document.getElementById('srcTA').value=S.out;
    S.out='';setOut('');go();
  }
  buildTabs();
});

const ta=document.getElementById('srcTA');
ta.addEventListener('input',()=>{
  const v=ta.value;
  document.getElementById('charCt').textContent=v.length+' / 5000';
  document.getElementById('clrBtn').style.display=v?'flex':'none';
  if(debT)clearTimeout(debT);
  if(!v.trim()){setOut('');document.getElementById('dind').style.display='none';return;}
  document.getElementById('dind').style.display='inline';
  debT=setTimeout(()=>{document.getElementById('dind').style.display='none';go();},800);
});

document.getElementById('clrBtn').addEventListener('click',()=>{
  ta.value='';S.out='';
  document.getElementById('charCt').textContent='0 / 5000';
  document.getElementById('clrBtn').style.display='none';
  setOut('');
});

function setOut(txt){
  const el=document.getElementById('outEl');
  const cb=document.getElementById('copyBtn');
  if(!txt){el.className='out-text ph';el.textContent='翻译';cb.style.display='none';}
  else{el.className='out-text';el.textContent=txt;cb.style.display='flex';}
  S.out=txt;
}

async function go(){
  const src=ta.value.trim();
  if(!src)return;
  if(!S.cfg.key){toast('请先点击"配置 API"填写 API Key');return;}
  document.getElementById('ldots').style.display='flex';
  document.getElementById('outEl').style.display='none';
  S.out='';
  const prompt=`你是专业翻译引擎。将以下文本从【${S.src}】翻译成【${S.tgt}】。仅输出翻译结果，不含任何解释。保持原文语气和格式。\n\n${src}`;
  try{
    const base=S.cfg.url.replace(/\/+$/,'');
    const res=await fetch(base+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.cfg.key},
      body:JSON.stringify({model:S.cfg.mdl,messages:[{role:'user',content:prompt}],stream:true,temperature:0.3})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let acc='';
    document.getElementById('ldots').style.display='none';
    document.getElementById('outEl').style.display='block';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      const chunk=dec.decode(value,{stream:true});
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data: ')||line.includes('[DONE]'))continue;
        try{const d=JSON.parse(line.slice(6));acc+=d.choices[0]?.delta?.content||'';}catch(_){}
      }
      setOut(acc);
    }
  }catch(e){
    document.getElementById('ldots').style.display='none';
    document.getElementById('outEl').style.display='block';
    setOut('翻译失败：'+e.message);
  }
}

document.getElementById('copyBtn').addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(S.out);
    const b=document.getElementById('copyBtn');
    b.classList.add('ok');
    document.getElementById('copyIco').className='ti ti-check';
    document.getElementById('copyLbl').textContent='已复制';
    setTimeout(()=>{b.classList.remove('ok');document.getElementById('copyIco').className='ti ti-copy';document.getElementById('copyLbl').textContent='复制翻译';},2000);
  }catch(e){toast('复制失败');}
});

document.getElementById('openCfg').addEventListener('click',()=>{
  document.getElementById('cfgUrl').value=S.cfg.url;
  document.getElementById('cfgKey').value=S.cfg.key;
  document.getElementById('cfgMdl').value=S.cfg.mdl;
  document.getElementById('modalWrap').style.display='flex';
});
const closeMod=()=>document.getElementById('modalWrap').style.display='none';
document.getElementById('mCls').addEventListener('click',closeMod);
document.getElementById('mCancel').addEventListener('click',closeMod);
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target===document.getElementById('modalWrap'))closeMod();});
document.getElementById('mSave').addEventListener('click',()=>{
  S.cfg.url=document.getElementById('cfgUrl').value.trim()||'https://api.openai.com/v1';
  S.cfg.key=document.getElementById('cfgKey').value.trim();
  S.cfg.mdl=document.getElementById('cfgMdl').value.trim()||'gpt-4o-mini';
  localStorage.setItem('gt_url',S.cfg.url);
  localStorage.setItem('gt_key',S.cfg.key);
  localStorage.setItem('gt_mdl',S.cfg.mdl);
  closeMod();toast('设置已保存');
  if(ta.value.trim())go();
});

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}

buildTabs();
</script>
